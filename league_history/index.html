<script>
const API='https://api.sleeper.app/v1';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const state={seasons:[],active:null,tab:'overview',players:{},loadedPlayers:false,backupMessage:'',searchQuery:'',compareA:'',compareB:'',playerQuery:'',playerSelected:'',ctespnSeason:'all',ctespnManager:'',legacyManager:'',cacheMeta:{}};
window.state=state;
const cacheKey=id=>`ucl_history_${id}_v1`;
const cacheMetaKey=id=>`ucl_history_${id}_meta_v1`;
const DB_NAME='ucl_league_history_db_v1', DB_STORE='archives';
function openHistoryDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'rootLeagueId'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('IndexedDB could not be opened.'))})}
async function idbGet(root){const db=await openHistoryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(String(root));req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function idbPut(root,seasons,meta={}){const db=await openHistoryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put({rootLeagueId:String(root),seasons,meta,updatedAt:Date.now()});tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{const e=tx.error;db.close();reject(e||new Error('IndexedDB write failed.'))};tx.onabort=()=>{const e=tx.error;db.close();reject(e||new Error('IndexedDB write was aborted.'))}})}
async function idbDelete(root){const db=await openHistoryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(String(root));tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{const e=tx.error;db.close();reject(e)}})}
function stamp(ts){if(!ts)return 'Never';try{return new Date(ts).toLocaleString()}catch{return 'Unknown'}}
const fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const pct=(w,l,t=0)=>{const g=w+l+t;return g?((w+t*.5)/g).toFixed(3).replace(/^0/,''):'.000'};
async function j(url){const r=await fetch(url);if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
function status(msg,err=false){$('#status').innerHTML=err?`<span class="error">${esc(msg)}</span>`:msg}
function teamName(user,roster){return user?.metadata?.team_name || user?.display_name || user?.username || `Roster ${roster?.roster_id??'?'}`}
function managerName(user,roster){return user?.username || user?.display_name || user?.metadata?.team_name || `Roster ${roster?.roster_id??'?'}`}
function managerNameForRoster(s,rosterId){const {ownerByRoster,rm}=mapping(s),u=ownerByRoster.get(Number(rosterId)),r=rm.get(Number(rosterId));const snap=identitySnapshotForRoster(s,rosterId);return snap?.username||u?.username||u?.display_name||snap?.team_name||teamName(u,r)}
function buildIdentitySnapshot(users=[],rosters=[]){
  const um=new Map(users.map(u=>[u.user_id,u]));
  return rosters.map(r=>{const u=um.get(r.owner_id)||{};return {season_roster_id:r.roster_id,user_id:u.user_id||r.owner_id||null,username:u.username||'',display_name:u.display_name||'',team_name:u.metadata?.team_name||'',roster_id:r.roster_id,owner_id:r.owner_id||null}})
}
function ensureIdentitySnapshot(s){if(!Array.isArray(s.identities)||!s.identities.length)s.identities=buildIdentitySnapshot(s.users||[],s.rosters||[]);return s.identities}
function identitySnapshotForRoster(s,rosterId){return ensureIdentitySnapshot(s).find(x=>Number(x.roster_id)===Number(rosterId))||null}
function identitySubline(s,rosterId){const i=identitySnapshotForRoster(s,rosterId);if(!i)return '';const parts=[];if(i.team_name)parts.push(i.team_name);if(i.display_name && i.display_name!==i.username && i.display_name!==i.team_name)parts.push(i.display_name);return parts.join(' • ')}
function identityHtml(s,rosterId){const t=identitySubline(s,rosterId);return t?`<div class="identity-line">${esc(t)}</div>`:''}

function pf(settings){return Number(settings?.fpts||0)+Number(settings?.fpts_decimal||0)/100}
function pa(settings){return Number(settings?.fpts_against||0)+Number(settings?.fpts_against_decimal||0)/100}
async function fetchSeason(id){
  const league=await j(`${API}/league/${id}`);
  const [users,rosters,drafts,winners,losers]=await Promise.all([
    j(`${API}/league/${id}/users`).catch(()=>[]),j(`${API}/league/${id}/rosters`).catch(()=>[]),j(`${API}/league/${id}/drafts`).catch(()=>[]),j(`${API}/league/${id}/winners_bracket`).catch(()=>[]),j(`${API}/league/${id}/losers_bracket`).catch(()=>[])
  ]);
  const draftPicks=[]; for(const d of drafts){const picks=await j(`${API}/draft/${d.draft_id}/picks`).catch(()=>[]);draftPicks.push({draft:d,picks})}
  const matchupWeeks=[]; const transactionWeeks=[]; const weeks=Math.max(18,Number(league.settings?.playoff_week_start||15)+3);
  for(let w=1;w<=weeks;w++){
    const [m,tr]=await Promise.all([
      j(`${API}/league/${id}/matchups/${w}`).catch(()=>[]),
      j(`${API}/league/${id}/transactions/${w}`).catch(()=>[])
    ]);
    if(m?.length) matchupWeeks.push({week:w,matchups:m});
    if(tr?.length) transactionWeeks.push({week:w,transactions:tr});
  }
  const identities=buildIdentitySnapshot(users,rosters);
  return {id,league,users,rosters,identities,draftPicks,winners,losers,matchupWeeks,transactionWeeks,fetchedAt:Date.now()};
}
async function sync(){
  const root=$('#leagueId').value.trim(); if(!root)return;
  $('#syncBtn').disabled=true;
  const previous=state.seasons;
  try{
    const fresh=[];let id=root,seen=new Set(),guard=0;
    while(id && id!=='0' && !seen.has(id) && guard<30){
      seen.add(id);guard++;
      status(`<span class="loading">Manually syncing Sleeper season ${guard}… Saved data remains available until sync completes.</span>`);
      const s=await fetchSeason(id);fresh.push(s);id=s.league.previous_league_id;
    }
    fresh.sort((a,b)=>Number(b.league.season)-Number(a.league.season));
    state.seasons=fresh;state.active=fresh[0]?.league.season||null;
    const syncedAt=Date.now();
    state.cacheMeta={syncedAt,seasonCount:fresh.length,rootLeagueId:root};
    await idbPut(root,fresh,state.cacheMeta);
    try{localStorage.setItem(cacheMetaKey(root),JSON.stringify({...state.cacheMeta,storage:'indexeddb'}))}catch{}
    try{localStorage.removeItem(cacheKey(root))}catch{}
    status(`Saved <b>${fresh.length}</b> linked season${fresh.length===1?'':'s'} in the browser database. Last Sleeper sync: <b>${esc(stamp(syncedAt))}</b>. No further API calls will occur unless you press Sync from Sleeper again.`);
    render();
  }catch(e){
    state.seasons=previous;
    status(`Sync failed: ${e.message}. Your previously saved history was kept unchanged.`,true);render();
  }finally{$('#syncBtn').disabled=false}
}
async function loadCache(root=$('#leagueId').value.trim()){
  try{
    let record=await idbGet(root);
    if(!record){
      // Backward-compatible one-time migration from older localStorage builds.
      try{
        const legacy=JSON.parse(localStorage.getItem(cacheKey(root))||'[]');
        const legacyMeta=JSON.parse(localStorage.getItem(cacheMetaKey(root))||'{}');
        if(Array.isArray(legacy)&&legacy.length){
          record={rootLeagueId:root,seasons:legacy,meta:legacyMeta};
          await idbPut(root,legacy,legacyMeta);
          try{localStorage.removeItem(cacheKey(root));localStorage.setItem(cacheMetaKey(root),JSON.stringify({...legacyMeta,storage:'indexeddb'}))}catch{}
        }
      }catch{}
    }
    const x=record?.seasons||[];const meta=record?.meta||{};
    if(x.length){
      x.forEach(ensureIdentitySnapshot);
      state.seasons=x;state.active=x[0].league.season;state.cacheMeta=meta;
      const fallback=Math.max(...x.map(s=>Number(s.fetchedAt||0)),0);
      const last=meta.syncedAt||fallback;
      status(`Loaded <b>${x.length}</b> season${x.length===1?'':'s'} entirely from the browser database. Last Sleeper sync: <b>${esc(stamp(last))}</b>. API access is manual only.`);
      render();return true;
    }
  }catch(e){status(`Saved history could not be read: ${e.message}`,true)}
  status('No saved league history found. You can restore a backup immediately or press <b>Sync from Sleeper</b> once to capture it locally.');
  return false;
}
function season(){return state.seasons.find(x=>String(x.league.season)===String(state.active))||state.seasons[0]}
function mapping(s){const um=new Map(s.users.map(u=>[u.user_id,u]));const rm=new Map(s.rosters.map(r=>[r.roster_id,r]));const ownerByRoster=new Map(s.rosters.map(r=>[r.roster_id,um.get(r.owner_id)]));return{um,rm,ownerByRoster}}
function placementMap(s){const p=new Map();for(const m of s.winners||[]){if(m.p){if(m.w)p.set(m.w,Number(m.p));if(m.l)p.set(m.l,Number(m.p)+1)}}return p}
function standings(s){const {ownerByRoster}=mapping(s), pm=placementMap(s);return [...s.rosters].sort((a,b)=>{const aw=a.settings?.wins||0,bw=b.settings?.wins||0;if(bw!==aw)return bw-aw;return pf(b.settings)-pf(a.settings)}).map((r,i)=>({r,u:ownerByRoster.get(r.roster_id),rank:i+1,place:pm.get(r.roster_id)}))}

function bytesLabel(n){n=Number(n||0);if(n<1024)return `${n} B`;if(n<1024*1024)return `${(n/1024).toFixed(1)} KB`;return `${(n/1024/1024).toFixed(2)} MB`}
function backupPayload(root=$('#leagueId').value.trim()){
  const meta=state.cacheMeta||{};
  return {format:'UCL_LEAGUE_HISTORY_BACKUP',schemaVersion:1,appVersion:'1.27',exportedAt:Date.now(),rootLeagueId:root,meta,seasons:state.seasons};
}
function downloadBackup(){
  const root=$('#leagueId').value.trim();
  if(!state.seasons.length){state.backupMessage='There is no cached league history to export yet.';render();return}
  try{
    const payload=backupPayload(root);const json=JSON.stringify(payload);const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');const years=state.seasons.map(s=>Number(s.league?.season)).filter(Number.isFinite).sort((a,b)=>a-b);
    a.href=url;a.download=`ucl-league-history-${years[0]||'history'}-${years.at(-1)||'latest'}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    state.backupMessage=`Backup created: ${state.seasons.length} seasons, ${bytesLabel(new Blob([json]).size)}.`;render();
  }catch(e){state.backupMessage=`Backup failed: ${e.message}`;render()}
}
function validateBackupPayload(data){
  if(!data||data.format!=='UCL_LEAGUE_HISTORY_BACKUP')throw new Error('This is not a UCL League History backup file.');
  if(Number(data.schemaVersion)!==1)throw new Error(`Unsupported backup schema version: ${data.schemaVersion}`);
  if(!Array.isArray(data.seasons)||!data.seasons.length)throw new Error('The backup contains no seasons.');
  for(const s of data.seasons){if(!s||!s.league||!s.league.league_id||!s.league.season)throw new Error('At least one season is missing required Sleeper league data.')}
  const ids=new Set(data.seasons.map(s=>String(s.league.league_id)));if(ids.size!==data.seasons.length)throw new Error('The backup contains duplicate season league IDs.');
  return data;
}
async function importBackupFile(file){
  if(!file)return;
  const existing=state.seasons;
  try{
    const text=await file.text();const data=validateBackupPayload(JSON.parse(text));const root=String(data.rootLeagueId||data.seasons[0]?.league?.league_id||'').trim();
    if(!root)throw new Error('The backup does not identify a root league.');
    const current=$('#leagueId').value.trim();
    if(current&&current!==root&&!confirm(`This backup belongs to root league ${root}, while the viewer currently shows ${current}. Switch to the backup league and restore it?`)){state.backupMessage='Import canceled. Existing cache was unchanged.';render();return}
    if(existing.length&&!confirm(`Restore ${data.seasons.length} cached season${data.seasons.length===1?'':'s'} from this backup? This replaces the locally saved browser database history for league ${root}.`)){state.backupMessage='Import canceled. Existing cache was unchanged.';render();return}
    data.seasons.forEach(ensureIdentitySnapshot);
    const meta={...(data.meta||{}),rootLeagueId:root,restoredAt:Date.now(),restoredFromExportAt:data.exportedAt||null,seasonCount:data.seasons.length,storage:'indexeddb'};
    const restored=data.seasons.sort((a,b)=>Number(b.league.season)-Number(a.league.season));
    await idbPut(root,restored,meta);
    try{localStorage.removeItem(cacheKey(root));localStorage.setItem(cacheMetaKey(root),JSON.stringify(meta))}catch{}
    $('#leagueId').value=root;state.seasons=restored;state.cacheMeta=meta;state.active=state.seasons[0]?.league?.season||null;
    state.backupMessage=`Restored ${state.seasons.length} seasons from backup. No Sleeper API request was made.`;status(`Restored <b>${state.seasons.length}</b> seasons from a local backup. No Sleeper API request was made.`);render();
  }catch(e){state.seasons=existing;state.backupMessage=`Import failed: ${e.message}. Existing cache was not changed.`;render()}
}
function viewBackup(s){
  const root=$('#leagueId').value.trim();const meta=state.cacheMeta||{};
  const years=state.seasons.map(x=>Number(x.league?.season)).filter(Number.isFinite).sort((a,b)=>a-b);const payload=state.seasons.length?JSON.stringify(backupPayload(root)):'';const size=payload?bytesLabel(new Blob([payload]).size):'—';
  const tx=state.seasons.reduce((n,x)=>n+(x.transactionWeeks||[]).reduce((a,w)=>a+(w.transactions||[]).length,0),0);const games=state.seasons.reduce((n,x)=>n+(x.matchupWeeks||[]).reduce((a,w)=>a+(w.matchups||[]).length,0),0);
  return `<div class="grid"><section class="card span12"><div class="section-title"><h2>Backup & Restore</h2><small>Portable local archive • never contacts Sleeper</small></div><div class="backup-good"><b>Your API capture can live outside this browser.</b> Export creates one JSON file containing the complete saved season payloads and cache metadata. Restore loads that file into the browser database without contacting Sleeper.</div>${state.backupMessage?`<div class="postseason-note">${esc(state.backupMessage)}</div>`:''}</section>
  <section class="card span12"><div class="backup-grid"><article class="backup-card"><h3>Current Local Archive</h3><div class="backup-meta"><div><b>${state.seasons.length}</b><span>Seasons</span></div><div><b>${years.length?`${years[0]}–${years.at(-1)}`:'—'}</b><span>Season Range</span></div><div><b>${size}</b><span>Backup Size</span></div><div><b>${games.toLocaleString()}</b><span>Roster-Week Rows</span></div><div><b>${tx.toLocaleString()}</b><span>Transactions</span></div><div><b>${esc(stamp(meta.syncedAt))}</b><span>Last API Sync</span></div></div><div class="backup-actions"><button class="btn primary" id="backupDownload">Download Full Backup</button></div></article>
  <article class="backup-card"><h3>Restore a Backup</h3><p class="muted tiny">Choose a JSON backup previously exported by this viewer. The file is validated before anything is written. Invalid or canceled imports leave your existing local cache untouched.</p><input type="file" id="backupFile" accept="application/json,.json" class="hidden"><div class="backup-actions"><button class="btn" id="backupChoose">Choose Backup File</button></div><div class="backup-warning"><b>Restore replaces the saved cache for the backup's root league ID.</b> The viewer asks for confirmation before replacement if local history already exists.</div></article>
  <article class="backup-card"><h3>What the Backup Contains</h3><p class="tiny muted">Raw league, user, roster, identity, draft, matchup, playoff-bracket, and transaction payloads already captured by manual sync, plus sync metadata. Derived Hall of Fame, rivalry, record-book, luck, award, and storyline analytics are recalculated from those payloads after restore.</p><div class="backup-meta"><div><b>JSON</b><span>Portable Format</span></div><div><b>Schema 1</b><span>Validated</span></div><div><b>Local Only</b><span>Restore Source</span></div></div></article></div></section></div>`;
}

function managerDirectory(){return careerRows().map(c=>({key:String(c.key),name:c.username||c.name||c.key,display:c.displayName||'',seasons:c.seasonHistory||[],career:c})).sort((a,b)=>a.name.localeCompare(b.name))}
function searchHistory(query){const q=String(query||'').trim().toLowerCase();if(!q)return[];const out=[];const add=(type,title,sub,tab,season='')=>out.push({type,title,sub,tab,season});
 for(const c of careerRows()){const hay=[c.name,c.username,c.displayName,...(c.identityHistory||[]).flatMap(x=>[x.teamName,x.username,x.displayName])].join(' ').toLowerCase();if(hay.includes(q))add('Manager',c.username||c.name,`${c.seasons} season${c.seasons===1?'':'s'} • ${c.w}-${c.l}-${c.t} • ${c.titles} title${c.titles===1?'':'s'}`,'managerlegacy')}
 for(const ss of state.seasons){const y=String(ss.league.season);if(y.includes(q)||String(ss.league.name||'').toLowerCase().includes(q))add('Season',`${y} ${ss.league.name||''}`.trim(),`${ss.rosters.length} teams • ${ss.draftPicks.reduce((a,d)=>a+(d.picks||[]).length,0)} draft picks`,'overview',y);
  for(const block of ss.draftPicks||[])for(const p of block.picks||[]){const pl=playerLabel(p);if(!pl.resolved)continue;const mgr=managerNameForRoster(ss,p.roster_id);if([pl.name,pl.pos,pl.team,mgr].join(' ').toLowerCase().includes(q))add('Draft Pick',pl.name,`${y} • #${p.pick_no} • ${mgr} • ${pl.pos}${pl.team?' • '+pl.team:''}`,'draft',y)}
  for(const w of ss.matchupWeeks||[])for(const [,a] of groupedMatchups(w)){if(a.length<2)continue;const x=a[0],z=a[1],xn=managerNameForRoster(ss,x.roster_id),zn=managerNameForRoster(ss,z.roster_id);if(`${xn} ${zn} ${y} week ${w.week}`.toLowerCase().includes(q))add('Matchup',`${xn} vs ${zn}`,`${y} W${w.week} • ${fmt(x.points)}–${fmt(z.points)}`,'matchups',y)}
  const ch=championshipSummary(ss);if(ch&&`${ch.winnerName} ${ch.runnerName} ${y} championship`.toLowerCase().includes(q))add('Championship',`${ch.winnerName} def. ${ch.runnerName}`,`${y}${ch.week?' • W'+ch.week:''}${ch.winnerScore!=null?' • '+fmt(ch.winnerScore)+'–'+fmt(ch.runnerScore):''}`,'playoffs',y);
  for(const t of ss.transactions||[]){const participants=(t.roster_ids||[]).map(r=>managerNameForRoster(ss,r)).join(' '),players=[...Object.keys(t.adds||{}),...Object.keys(t.drops||{})].map(transactionPlayerName).filter(Boolean).join(' ');if(`${participants} ${players} ${t.type||''} ${y}`.toLowerCase().includes(q))add('Transaction',String(t.type||'transaction').replaceAll('_',' '),`${y} • ${participants||'Unknown participants'}${players?' • '+players:''}`,'transactions',y)}
 }

function viewSearch(){const results=searchHistory(state.searchQuery);return `<div class="grid"><section class="card span12"><div class="section-title"><h2>Historical Search</h2><small>Managers, seasons, players, draft picks, matchups, championships and transactions</small></div><div class="searchbar"><input id="historySearch" type="search" placeholder="Search username, player, season, matchup…" value="${esc(state.searchQuery)}"><button class="btn" id="historySearchBtn">Search</button><button class="btn secondary" id="historySearchClear">Clear</button></div>${state.searchQuery?`<div class="tiny muted" style="margin-top:8px">${results.length} result${results.length===1?'':'s'} shown for “${esc(state.searchQuery)}”.</div><div class="search-results">${results.map(r=>`<div class="search-result"><div class="search-type">${esc(r.type)}</div><b>${esc(r.title)}</b><div class="muted tiny">${esc(r.sub)}</div><button class="btn tiny-btn" style="margin-top:7px" data-search-tab="${r.tab}" ${r.season?`data-search-season="${esc(r.season)}"`:''}>Open</button></div>`).join('')||'<div class="empty">No matches found.</div>'}</div>`:'<div class="empty" style="margin-top:12px">Search the locally cached league archive. No Sleeper request is made.</div>'}</section></div>`}

function seasonPlayerPerformance(s){
  const totals=new Map(), starts=new Map(), weeksSeen=new Set();
  for(const w of s.matchupWeeks||[]){
    let weekHas=false;
    for(const m of w.matchups||[]){
      const pp=m.players_points||m.playersPoints||{};
      for(const [pid,val] of Object.entries(pp||{})){
        const n=Number(val); if(!Number.isFinite(n))continue;
        totals.set(String(pid),(totals.get(String(pid))||0)+n); weekHas=true;
      }
      for(const pid of m.starters||[]){if(pid!=null)starts.set(String(pid),(starts.get(String(pid))||0)+1)}
    }
    if(weekHas)weeksSeen.add(Number(w.week));
  }
  return {totals,starts,weeks:weeksSeen.size};
}
function historicalDraftValue(){
  const rows=[],seasonMeta=[];
  for(const s of state.seasons){
    const perf=seasonPlayerPerformance(s), picks=[];
    for(const block of s.draftPicks||[])for(const p of block.picks||[]){
      const pl=playerLabel(p),mgr=draftManagerKey(s,p.roster_id),pid=String(p.player_id||''); if(!pl.resolved)continue;
      if(!pid)continue;
      picks.push({season:String(s.league.season),pick:p,player:pl,manager:mgr,pid,points:perf.totals.has(pid)?perf.totals.get(pid):null,starts:perf.starts.get(pid)||0});
    }
    const scored=picks.filter(x=>x.points!=null).sort((a,b)=>b.points-a.points||Number(a.pick.pick_no)-Number(b.pick.pick_no));
    scored.forEach((x,i)=>x.performanceRank=i+1);
    const rankByPid=new Map(scored.map(x=>[`${x.pid}|${x.pick.pick_no}`,x.performanceRank]));
    for(const x of picks){
      const pr=rankByPid.get(`${x.pid}|${x.pick.pick_no}`); if(!pr)continue;
      x.performanceRank=pr; x.draftRank=Number(x.pick.pick_no)||0; x.valueDelta=x.draftRank-pr;
      rows.push(x);
    }
    seasonMeta.push({season:String(s.league.season),weeks:perf.weeks,picks:picks.length,scored:scored.length});
  }
  return {rows,seasonMeta};
}

  const managers=[...mgr.values()].sort((a,b)=>(b.sum/b.n)-(a.sum/a.n)||b.hits-a.hits);

function historicalTieCorroborated(s,a,b){
 const ap=Number(a?.points),bp=Number(b?.points); if(!Number.isFinite(ap)||!Number.isFinite(bp)||ap!==bp||ap===0)return false;
 const rm=new Map((s.rosters||[]).map(r=>[Number(r.roster_id),r]));
 return Number(rm.get(Number(a.roster_id))?.settings?.ties||0)>0 && Number(rm.get(Number(b.roster_id))?.settings?.ties||0)>0;
}
function historicalGameStatus(s,a,b){
 const ap=Number(a?.points),bp=Number(b?.points);
 if(!Number.isFinite(ap)||!Number.isFinite(bp))return {valid:false,reason:'missing-score'};
 if(ap===0&&bp===0)return {valid:false,reason:'all-zero'};
 if(ap===bp&&!historicalTieCorroborated(s,a,b))return {valid:false,reason:'uncorroborated-tie'};
 return {valid:true,tie:ap===bp};
}
function historicalGameAudit(){
 const anomalies=[],officialTies=[];
 for(const s of state.seasons)for(const w of s.matchupWeeks||[])for(const [,g] of groupedMatchups(w)){
  if(g.length<2)continue;const [a,b]=g,st=historicalGameStatus(s,a,b),ai=identityForRoster(s,a.roster_id),bi=identityForRoster(s,b.roster_id);
  if(!st.valid&&['all-zero','uncorroborated-tie'].includes(st.reason))anomalies.push({season:String(s.league.season),week:Number(w.week),reason:st.reason,a:ai.name,b:bi.name,ap:Number(a.points)||0,bp:Number(b.points)||0});
  else if(st.valid&&st.tie)officialTies.push({season:String(s.league.season),week:Number(w.week),a:ai.name,b:bi.name,score:Number(a.points)||0});
 }
 return {anomalies,officialTies};
}

function groupedMatchups(w){const m=new Map();for(const x of w.matchups){if(x.matchup_id==null)continue;if(!m.has(x.matchup_id))m.set(x.matchup_id,[]);m.get(x.matchup_id).push(x)}return [...m.entries()]}
function viewMatchups(s){const {ownerByRoster,rm}=mapping(s);return `<div class="card"><div class="section-title"><h2>${s.league.season} Matchups</h2><small>${s.matchupWeeks.length} weeks available</small></div>${s.matchupWeeks.map(w=>`<details class="details"><summary>Week ${w.week}</summary>${groupedMatchups(w).map(([id,a])=>{if(a.length<2)return'';const [x,y]=a;const xn=managerName(ownerByRoster.get(x.roster_id),rm.get(x.roster_id)),yn=managerName(ownerByRoster.get(y.roster_id),rm.get(y.roster_id));const xw=Number(x.points)>Number(y.points);const yw=Number(y.points)>Number(x.points);return `<div class="matchup"><div class="match-row"><span class="${xw?'winner':''}">${esc(xn)}</span><b>${fmt(x.points)}</b></div><div class="match-row"><span class="${yw?'winner':''}">${esc(yn)}</span><b>${fmt(y.points)}</b></div></div>`}).join('')}</details>`).join('')}</div>`}
function bracketRows(arr,s){const {ownerByRoster,rm}=mapping(s);return arr.length?`<table class="stack-table"><thead><tr><th>Round</th><th>Match</th><th>Manager 1</th><th>Manager 2</th><th>Winner</th><th>Place</th></tr></thead><tbody>${arr.map(m=>{const n=id=>id?managerName(ownerByRoster.get(id),rm.get(id)):'TBD';return `<tr><td data-label="Round">${m.r??'—'}</td><td data-label="Match">${m.m??'—'}</td><td data-label="Team 1">${esc(typeof m.t1==='number'?n(m.t1):'From prior')}</td><td data-label="Team 2">${esc(typeof m.t2==='number'?n(m.t2):'From prior')}</td><td data-label="Winner">${esc(n(m.w))}</td><td data-label="Place">${m.p??'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No bracket data returned.</div>'}
function playoffRosterIds(s){const ids=new Set();for(const m of s.winners||[]){for(const k of ['t1','t2','w','l'])if(Number.isFinite(Number(m[k]))&&Number(m[k])>0)ids.add(Number(m[k]))}return ids}
function seasonRankMap(s){return new Map(standings(s).map(x=>[Number(x.r.roster_id),x.rank]))}
function seedFor(s,rosterId){const r=(s.rosters||[]).find(x=>Number(x.roster_id)===Number(rosterId));const explicit=Number(r?.settings?.playoff_seed);if(Number.isFinite(explicit)&&explicit>0)return {value:explicit,explicit:true};const rank=seasonRankMap(s).get(Number(rosterId));return rank?{value:rank,explicit:false}:null}
function championshipBracketGame(s){const finals=(s.winners||[]).filter(m=>Number(m.p)===1);if(finals.length)return finals.sort((a,b)=>Number(b.r||0)-Number(a.r||0))[0];const decided=(s.winners||[]).filter(m=>m.w&&m.l);return decided.sort((a,b)=>Number(b.r||0)-Number(a.r||0)||Number(b.m||0)-Number(a.m||0))[0]||null}
function matchupForRosters(s,a,b){if(!a||!b)return null;const start=Number(s.league?.settings?.playoff_week_start||0);const weeks=[...(s.matchupWeeks||[])].filter(w=>!start||Number(w.week)>=start).sort((x,y)=>Number(y.week)-Number(x.week));for(const w of weeks){for(const [,g] of groupedMatchups(w)){if(g.length<2)continue;const ids=g.map(x=>Number(x.roster_id));if(ids.includes(Number(a))&&ids.includes(Number(b)))return {week:Number(w.week),a:g.find(x=>Number(x.roster_id)===Number(a)),b:g.find(x=>Number(x.roster_id)===Number(b))}}}return null}
function championshipSummary(s){const g=championshipBracketGame(s);if(!g||!g.w||!g.l)return null;const {ownerByRoster,rm}=mapping(s),win=Number(g.w),lose=Number(g.l),match=matchupForRosters(s,win,lose);return {winner:win,runnerUp:lose,winnerName:managerName(ownerByRoster.get(win),rm.get(win)),runnerName:managerName(ownerByRoster.get(lose),rm.get(lose)),winnerSeed:seedFor(s,win),runnerSeed:seedFor(s,lose),week:match?.week||null,winnerScore:match?.a?.points??null,runnerScore:match?.b?.points??null}}
function postseasonGames(s){const start=Number(s.league?.settings?.playoff_week_start||0);if(!start)return[];const playoffIds=playoffRosterIds(s),out=[];for(const w of s.matchupWeeks||[]){if(Number(w.week)<start)continue;for(const [,a] of groupedMatchups(w)){if(a.length<2)continue;const [x,y]=a;if(!playoffIds.has(Number(x.roster_id))||!playoffIds.has(Number(y.roster_id)))continue;out.push({week:Number(w.week),x,y})}}return out}
function postseasonManagerStats(){const by=new Map();for(const s of state.seasons){const ids=playoffRosterIds(s),champ=championshipSummary(s);for(const rid of ids){const i=identityForRoster(s,rid);if(!by.has(i.key))by.set(i.key,{key:i.key,name:i.name,apps:0,w:0,l:0,t:0,titles:0,runnerUps:0,pf:0,pa:0,seasons:[]});const z=by.get(i.key);z.name=i.name;z.apps++;z.seasons.push(String(s.league.season));if(champ?.winner===rid)z.titles++;if(champ?.runnerUp===rid)z.runnerUps++}for(const g of postseasonGames(s)){for(const [me,opp] of [[g.x,g.y],[g.y,g.x]]){const i=identityForRoster(s,me.roster_id);if(!ids.has(Number(me.roster_id)))continue;if(!by.has(i.key))by.set(i.key,{key:i.key,name:i.name,apps:0,w:0,l:0,t:0,titles:0,runnerUps:0,pf:0,pa:0,seasons:[]});const z=by.get(i.key),ms=Number(me.points)||0,os=Number(opp.points)||0;z.pf+=ms;z.pa+=os;if(ms>os)z.w++;else if(ms<os)z.l++;else z.t++}}}return [...by.values()].sort((a,b)=>b.titles-a.titles||b.runnerUps-a.runnerUps||b.w-a.w||b.apps-a.apps)}
function championshipHistory(){return [...state.seasons].sort((a,b)=>Number(b.league.season)-Number(a.league.season)).map(s=>({season:String(s.league.season),summary:championshipSummary(s)})).filter(x=>x.summary)}
function seedHtml(x){return x?`<span class="seed" title="${x.explicit?'Sleeper playoff seed':'Inferred from regular-season standings'}">#${x.value}${x.explicit?'':'*'}</span>`:''}

function transactionPlayerName(pid){
  if(!pid)return '';
  for(const s of state.seasons){for(const block of (s.draftPicks||[])){const p=(block.picks||[]).find(x=>String(x.player_id)===String(pid));if(p){const pl=playerLabel(p);if(pl.resolved)return pl.name}}}
  return '';
}
function transactionRosterIdentity(s,rosterId){
  if(rosterId===undefined||rosterId===null)return {name:'Unknown roster',username:''};
  const {ownerByRoster}=mapping(s),r=(s.rosters||[]).find(x=>Number(x.roster_id)===Number(rosterId)),u=ownerByRoster.get(Number(rosterId));
  const snap=identitySnapshotForRoster(s,rosterId);
  return {name:snap?.username||u?.username||managerName(u,r||{roster_id:rosterId}),username:snap?.username||u?.username||'',teamName:snap?.team_name||teamName(u,r||{roster_id:rosterId})};
}
function transactionManagerFromCreator(s,creator){
  const u=(s.users||[]).find(x=>String(x.user_id)===String(creator));
  if(!u)return creator?String(creator):'System / unknown';
  return u.username||u.display_name||u.metadata?.team_name||String(creator);
}
function allTransactions(){
 const out=[];
 for(const s of state.seasons){for(const w of (s.transactionWeeks||[])){for(const tr of (w.transactions||[])){out.push({season:String(s.league.season),week:Number(w.week),s,tr})}}}
 return out.sort((a,b)=>Number(b.season)-Number(a.season)||b.week-a.week||Number(b.tr.created||0)-Number(a.tr.created||0));
}
function transactionSummary(x){
 const {s,tr}=x,type=String(tr.type||'transaction').toLowerCase();
 const rosters=(tr.roster_ids||[]).map(id=>transactionRosterIdentity(s,id));
 const adds=Object.entries(tr.adds||{}).map(([pid,rid])=>({pid,rid,name:transactionPlayerName(pid),team:transactionRosterIdentity(s,rid)})).filter(x=>x.name);
 const drops=Object.entries(tr.drops||{}).map(([pid,rid])=>({pid,rid,name:transactionPlayerName(pid),team:transactionRosterIdentity(s,rid)})).filter(x=>x.name);
 const bid=Number(tr.settings?.waiver_bid??tr.settings?.waiver_amount??0)||0;
 return {type,rosters,adds,drops,bid,draftPicks:tr.draft_picks||[],waiverBudget:tr.waiver_budget||[],status:tr.status||'',created:tr.created||0,creator:transactionManagerFromCreator(s,tr.creator)};
}
function transactionManagerStats(){

 const ensure=(s,rid)=>{const id=transactionRosterIdentity(s,rid),snap=identitySnapshotForRoster(s,rid),key=snap?.user_id||`roster:${s.league.season}:${rid}`;if(!by.has(key))by.set(key,{key,name:id.name,username:id.username,total:0,trades:0,waivers:0,freeAgents:0,adds:0,drops:0,faab:0,seasons:new Set()});const m=by.get(key);m.name=id.name||m.name;m.username=id.username||m.username;m.seasons.add(String(s.league.season));return m};
 for(const x of allTransactions()){
  const {s,tr}=x,type=String(tr.type||'').toLowerCase(),rids=[...(tr.roster_ids||[])];
  for(const rid of rids){const m=ensure(s,rid);m.total++;if(type==='trade')m.trades++;else if(type==='waiver')m.waivers++;else if(type==='free_agent')m.freeAgents++;}
  for(const [,rid] of Object.entries(tr.adds||{})){const m=ensure(s,rid);m.adds++;}
  for(const [,rid] of Object.entries(tr.drops||{})){const m=ensure(s,rid);m.drops++;}
  const bid=Number(tr.settings?.waiver_bid??tr.settings?.waiver_amount??0)||0;if(bid&&rids.length){const m=ensure(s,rids[0]);m.faab+=bid;}
  if(type==='trade'&&rids.length>1){for(let i=0;i<rids.length;i++)for(let j=i+1;j<rids.length;j++){const a=ensure(s,rids[i]),b=ensure(s,rids[j]),k=[a.key,b.key].sort().join('|');if(!partners.has(k))partners.set(k,{a,b,count:0,seasons:new Set()});const p=partners.get(k);p.count++;p.seasons.add(String(s.league.season));}}
 }
 return {managers:[...by.values()],partners:[...partners.values()]};
}

 if(sum.drops.length)parts.push(`<div><span class="bad"><b>Drops:</b></span> ${sum.drops.map(a=>`${esc(a.name)} ← ${esc(a.team.name)}`).join(' • ')}</div>`);

 if(sum.waiverBudget.length)parts.push(`<div><b>FAAB transfers:</b> ${sum.waiverBudget.map(w=>`${esc(transactionRosterIdentity({users:[],rosters:[]},w.sender).name)} ${esc(w.amount||0)} → roster ${esc(w.receiver??'?')}`).join(' • ')}</div>`);
 if(sum.bid)parts.push(`<div><b>Waiver bid:</b> ${fmt(sum.bid)}</div>`);

function postTradePlayerStats(s,pid,rosterId,fromWeek){
 let points=0,weeks=0,starts=0;
 for(const w of (s.matchupWeeks||[])){
  if(Number(w.week)<Number(fromWeek))continue;
  const m=(w.matchups||[]).find(x=>Number(x.roster_id)===Number(rosterId));
  if(!m)continue;
  const players=(m.players||[]).map(String);
  if(!players.includes(String(pid)))continue;
  weeks++;
  const pp=m.players_points||m.playersPoints||{};
  const val=Number(pp?.[pid]); if(Number.isFinite(val))points+=val;
  if((m.starters||[]).map(String).includes(String(pid)))starts++;
 }
 return {points,weeks,starts};
}
function tradeEvaluationData(){
 const trades=allTransactions().filter(x=>String(x.tr.type||'').toLowerCase()==='trade');
 return trades.map(x=>{
  const {s,tr}=x,rids=[...(tr.roster_ids||[])].map(Number),sum=transactionSummary(x);
  const sides=rids.map(rid=>{
   const id=transactionRosterIdentity(s,rid);
   const received=Object.entries(tr.adds||{}).filter(([,to])=>Number(to)===rid).map(([pid])=>{const stat=postTradePlayerStats(s,pid,rid,x.week);return {pid,name:transactionPlayerName(pid),...stat}}).filter(x=>x.name);
   const sent=Object.entries(tr.drops||{}).filter(([,from])=>Number(from)===rid).map(([pid])=>({pid,name:transactionPlayerName(pid)})).filter(x=>x.name);
   const recvPicks=(tr.draft_picks||[]).filter(p=>Number(p.owner_id)===rid);
   const sentPicks=(tr.draft_picks||[]).filter(p=>Number(p.previous_owner_id)===rid);
   const points=received.reduce((a,b)=>a+b.points,0),weeks=received.reduce((a,b)=>a+b.weeks,0),starts=received.reduce((a,b)=>a+b.starts,0);
   return {rid,...id,received,sent,recvPicks,sentPicks,points,weeks,starts};
  });
  const hasPicks=sides.some(z=>z.recvPicks.length||z.sentPicks.length), ranked=[...sides].sort((a,b)=>b.points-a.points);
  let verdict='Not enough captured player production to compare yet.',status='open';
  if(ranked.length>=2 && ranked[0].points>0){
    const diff=ranked[0].points-ranked[1].points;
    verdict=`Post-trade production leader: ${ranked[0].name} by ${fmt(diff)} captured points.`;
    status=hasPicks?'open':'closed';
  }
  if(hasPicks)verdict+=' Draft-pick value remains unresolved, so this is not a final trade winner.';
  return {...x,sum,sides,hasPicks,verdict,status};
 });
}
function tradePickLabel(p){return `${esc(p.season||'?')} R${esc(p.round||'?')}`}

cks:</b> ${z.sentPicks.map(tradePickLabel).join(' • ')}</div>`:''}</div><div class="trade-production"><span class="pill">${z.weeks} roster-wk</span><span class="pill">${z.starts} starts</span></div></div>`).join('')}<div class="trade-verdict ${t.status==='open'?'open':''}">${esc(t.verdict)}</div></article>`).join('')}</div></section></div>`;
}

function allGames(seasons=state.seasons){const out=[];for(const s of seasons){const {ownerByRoster,rm}=mapping(s);for(const w of s.matchupWeeks||[]){for(const [,a] of groupedMatchups(w)){if(a.length<2)continue;const [x,y]=a;if(!historicalGameStatus(s,x,y).valid)continue;out.push({season:s.league.season,week:w.week,x,y,xn:managerName(ownerByRoster.get(x.roster_id),rm.get(x.roster_id)),yn:managerName(ownerByRoster.get(y.roster_id),rm.get(y.roster_id))})}}}return out}
function gameRowsByManager(){const by=new Map();for(const s of state.seasons){for(const w of s.matchupWeeks||[]){for(const [,a] of groupedMatchups(w)){if(a.length<2)continue;const [x,y]=a;if(!historicalGameStatus(s,x,y).valid)continue;const xi=identityForRoster(s,x.roster_id),yi=identityForRoster(s,y.roster_id);for(const [me,opp,mi,oi] of [[x,y,xi,yi],[y,x,yi,xi]]){if(!by.has(mi.key))by.set(mi.key,{key:mi.key,name:mi.name,games:[]});const result=+me.points>+opp.points?'W':+me.points<+opp.points?'L':'T';by.get(mi.key).name=mi.name;by.get(mi.key).games.push({season:Number(s.league.season)||0,week:Number(w.week)||0,result,score:+me.points||0,oppScore:+opp.points||0,oppKey:oi.key,oppName:oi.name})}}}}for(const x of by.values())x.games.sort((a,b)=>a.season-b.season||a.week-b.week);return by}
function streakStats(games){let bestW=0,bestL=0,cw=0,cl=0,curType='',cur=0;for(const g of games){if(g.result==='W'){cw++;cl=0;bestW=Math.max(bestW,cw)}else if(g.result==='L'){cl++;cw=0;bestL=Math.max(bestL,cl)}else{cw=0;cl=0}}for(let i=games.length-1;i>=0;i--){const r=games[i].result;if(r==='T'){if(!curType)curType='T';break}if(!curType){curType=r;cur=1}else if(r===curType)cur++;else break}return {bestW,bestL,current:curType?(curType==='T'?'Tie':`${curType}${cur}`):'—'}}

function careerRows(){const by=new Map();for(const s of state.seasons){const {ownerByRoster}=mapping(s),pm=placementMap(s);for(const r of s.rosters){const u=ownerByRoster.get(r.roster_id);const key=u?.user_id||`roster:${s.league.season}:${r.roster_id}`;if(!by.has(key))by.set(key,{key,name:managerName(u,r),username:u?.username||'',displayName:u?.display_name||'',identityHistory:[],seasonHistory:[],w:0,l:0,t:0,pf:0,pa:0,seasons:0,titles:0,playoffs:0,best:null,worst:null});const x=by.get(key),st=r.settings||{},place=pm.get(r.roster_id)||null;x.name=managerName(u,r);x.username=u?.username||x.username;x.displayName=u?.display_name||x.displayName;const snap=identitySnapshotForRoster(s,r.roster_id);x.identityHistory.push({season:s.league.season,teamName:snap?.team_name||teamName(u,r),username:snap?.username||'',displayName:snap?.display_name||''});x.w+=st.wins||0;x.l+=st.losses||0;x.t+=st.ties||0;x.pf+=pf(st);x.pa+=pa(st);x.seasons++;if(place===1)x.titles++;if(place)x.playoffs++;const seasonRec={season:s.league.season,w:st.wins||0,l:st.losses||0,t:st.ties||0,pf:pf(st),pa:pa(st),place,teamName:snap?.team_name||teamName(u,r)};x.seasonHistory.push(seasonRec);if(!x.best||seasonRec.w>x.best.w||(seasonRec.w===x.best.w&&seasonRec.pf>x.best.pf))x.best=seasonRec;if(!x.worst||seasonRec.w<x.worst.w||(seasonRec.w===x.worst.w&&seasonRec.pf<x.worst.pf))x.worst=seasonRec}}return [...by.values()].sort((a,b)=>b.titles-a.titles||b.w-a.w||b.pf-a.pf)}
function legacyData(){
 const seasons=[...state.seasons].sort((a,b)=>Number(a.league.season)-Number(b.league.season));
 const years=seasons.map(s=>String(s.league.season));
 const byUser=new Map();
 for(const s of seasons){
  const rosterByOwner=new Map();
  for(const r of s.rosters||[]){if(r.owner_id)rosterByOwner.set(String(r.owner_id),r);for(const co of (r.co_owners||[]))rosterByOwner.set(String(co),r)}

   if(!byUser.has(key))byUser.set(key,{key,userId:u.user_id||'',latestUsername:'',latestDisplay:'',seasons:new Map()});
   const x=byUser.get(key),snap=identitySnapshotForRoster(s,r?.roster_id);
   x.latestUsername=u.username||x.latestUsername;x.latestDisplay=u.display_name||x.latestDisplay;
   x.seasons.set(String(s.league.season),{season:String(s.league.season),username:u.username||'',displayName:u.display_name||'',teamName:snap?.team_name||u.metadata?.team_name||u.display_name||u.username||'Unnamed',rosterId:r?.roster_id??null,hasRoster:!!r});
  }
 }
 const firstYear=years[0]||'',lastYear=years[years.length-1]||'';
 const people=[...byUser.values()].map(x=>{
   const activeYears=[...x.seasons.keys()].sort((a,b)=>Number(a)-Number(b));
   let gaps=0,longestRun=0,currentRun=0,runStart='',bestRunStart='',bestRunEnd='',prev=null;
   for(const y of activeYears){
    const n=Number(y);
    if(prev!==null&&n===prev+1){currentRun++}else{currentRun=1;runStart=y}
    if(currentRun>longestRun){longestRun=currentRun;bestRunStart=runStart;bestRunEnd=y}
    if(prev!==null&&n-prev>1)gaps++;
    prev=n;
   }
   let uninterruptedCurrent=0;
   if(activeYears.includes(lastYear)){
    let expect=Number(lastYear);
    for(let i=activeYears.length-1;i>=0;i--){const y=Number(activeYears[i]);if(y===expect){uninterruptedCurrent++;expect--}else if(y<expect)break}
   }
   return {...x,activeYears,first:activeYears[0]||'',last:activeYears[activeYears.length-1]||'',count:activeYears.length,isFounding:activeYears[0]===firstYear,isCurrent:activeYears.includes(lastYear),isReturnee:gaps>0,gaps,longestRun,currentRun:uninterruptedCurrent,bestRunStart,bestRunEnd};
 }).sort((a,b)=>Number(a.first)-Number(b.first)||b.count-a.count||(a.latestUsername||a.latestDisplay).localeCompare(b.latestUsername||b.latestDisplay));

   const curr=new Set(people.filter(p=>p.seasons.has(y)).map(p=>p.key));

   const joined=[...curr].filter(k=>!prev.has(k)).map(k=>people.find(p=>p.key===k));
   const left=[...prev].filter(k=>!curr.has(k)).map(k=>people.find(p=>p.key===k));

function hallOfFameRows(){
 const careers=careerRows(), post=new Map(postseasonManagerStats().map(x=>[x.key,x]));
 return careers.map(c=>{
   const p=post.get(c.key)||{apps:0,w:0,l:0,t:0,titles:0,runnerUps:0};
   const games=c.w+c.l+c.t, wp=games?(c.w+c.t*.5)/games:0;
   const tenurePts=c.seasons*2;
   const winsPts=c.w;
   const playoffAppPts=p.apps*3;
   const playoffWinPts=p.w*4;
   const runnerUpPts=p.runnerUps*8;
   const titlePts=p.titles*20;
   const sample=Math.min(1,games/28);
   const winPctPts=Math.min(15,Math.max(0,(wp-.5)*50))*sample;
   const score=tenurePts+winsPts+playoffAppPts+playoffWinPts+runnerUpPts+titlePts+winPctPts;
   return {...c,post:p,games,wp,score,components:{tenurePts,winsPts,playoffAppPts,playoffWinPts,runnerUpPts,titlePts,winPctPts}};
 }).sort((a,b)=>b.score-a.score||b.post.titles-a.post.titles||b.post.w-a.post.w||b.w-a.w);
}
function hofTier(score,max){const ratio=max?score/max:0;if(ratio>=.80)return ['Legend','legend'];if(ratio>=.58)return ['Great','great'];if(ratio>=.38)return ['Notable','notable'];return ['League Member','member']}

>Total Score</span></div></div></article>`}).join('')}</div></section>

}

small>Career totals from locally cached seasons</small></div><div class="scroll"><table class="stack-table"><thead><tr><th>Manager</th><th>Seasons</th><th>W-L-T</th><th>Pct</th><th>PF</th><th>PA</th><th>Titles*</th></tr></thead><tbody>${rows.map(x=>`<tr><td data-label="Manager"><b>${esc(x.name)}</b><div class="tiny muted">${esc(x.username?('@'+x.username):'')}${x.displayName&&x.displayName!==x.username?` • ${esc(x.displayName)}`:''}</div></td><td data-label="Seasons">${x.seasons}</td><td data-label="Record">${x.w}-${x.l}-${x.t}</td><td data-label="Win %">${pct(x.w,x.l,x.t)}</td><td data-label="Points For">${fmt(x.pf)}</td><td data-label="Points Against">${fmt(x.pa)}</td><td data-label="Titles" class="gold">${x.titles}</td></tr>`).join('')}</tbody></table></div><div class="tiny muted" style="margin-top:8px">* Titles inferred from available winners-bracket placement data; league configurations can affect bracket semantics.</div></section></div>`}
function identityForRoster(s,rosterId){const {ownerByRoster,rm}=mapping(s),u=ownerByRoster.get(rosterId),r=rm.get(rosterId);return {key:u?.user_id||`roster:${s.league.season}:${rosterId}`,name:managerName(u,r),teamName:teamName(u,r),username:u?.username||''}}
function headToHeadRows(){const pairs=new Map();for(const s of state.seasons){for(const w of s.matchupWeeks||[]){for(const [,a] of groupedMatchups(w)){if(a.length<2)continue;const [x,y]=a;if(!historicalGameStatus(s,x,y).valid)continue;const xi=identityForRoster(s,x.roster_id),yi=identityForRoster(s,y.roster_id);if(xi.key===yi.key)continue;const keys=[xi.key,yi.key].sort(),pk=keys.join('|');if(!pairs.has(pk))pairs.set(pk,{a:keys[0],b:keys[1],names:{[xi.key]:xi.name,[yi.key]:yi.name},wins:{[keys[0]]:0,[keys[1]]:0},ties:0,pf:{[keys[0]]:0,[keys[1]]:0},games:0,last:null});const p=pairs.get(pk);p.names[xi.key]=xi.name;p.names[yi.key]=yi.name;p.games++;p.pf[xi.key]+=Number(x.points||0);p.pf[yi.key]+=Number(y.points||0);if(+x.points>+y.points)p.wins[xi.key]++;else if(+y.points>+x.points)p.wins[yi.key]++;else p.ties++;p.last={season:s.league.season,week:w.week,winner:+x.points===+y.points?'Tie':(+x.points>+y.points?xi.name:yi.name)}}}}return [...pairs.values()].sort((a,b)=>b.games-a.games)}
function viewHeadToHead(){const rows=headToHeadRows();if(!rows.length)return '<div class="card empty">No head-to-head matchup history loaded.</div>';return `<div class="card"><div class="section-title"><h2>All-Time Head-to-Head</h2><small>Calculated entirely from locally cached matchup history</small></div><div class="h2h-grid">${rows.map(p=>`<article class="h2h-card"><div class="h2h-title">${esc(p.names[p.a])} vs ${esc(p.names[p.b])}</div><div class="h2h-line"><span>${esc(p.names[p.a])}</span><b>${p.wins[p.a]} wins</b></div><div class="h2h-line"><span>${esc(p.names[p.b])}</span><b>${p.wins[p.b]} wins</b></div><div class="h2h-line"><span>Ties / Meetings</span><b>${p.ties} / ${p.games}</b></div><div class="h2h-line"><span>Points</span><b>${fmt(p.pf[p.a])} – ${fmt(p.pf[p.b])}</b></div><div class="tiny muted" style="margin-top:7px">Latest: ${p.last?.season||'—'} W${p.last?.week||'—'} • ${esc(p.last?.winner||'—')}</div></article>`).join('')}</div></div>`}

function rivalryRows(){
 const pairs=new Map();
 for(const s of state.seasons){
  const poStart=Number(s.league?.settings?.playoff_week_start)||99;
  const champ=championshipSummary(s);
  const champWeek=Number(champ?.week)||null;
  for(const w of s.matchupWeeks||[]){
   for(const [,a] of groupedMatchups(w)){
    if(a.length<2)continue;
    const [x,y]=a;if(!historicalGameStatus(s,x,y).valid)continue;const xi=identityForRoster(s,x.roster_id),yi=identityForRoster(s,y.roster_id);
    if(xi.key===yi.key)continue;
    const keys=[xi.key,yi.key].sort(),pk=keys.join('|');
    if(!pairs.has(pk))pairs.set(pk,{a:keys[0],b:keys[1],names:{},wins:{[keys[0]]:0,[keys[1]]:0},ties:0,pf:{[keys[0]]:0,[keys[1]]:0},games:0,playoffGames:0,playoffWins:{[keys[0]]:0,[keys[1]]:0},titleGames:0,biggest:null,closest:null,last:null,streakKey:null,streakN:0,bestStreak:{key:null,n:0}});
    const p=pairs.get(pk);p.names[xi.key]=xi.name;p.names[yi.key]=yi.name;p.games++;p.pf[xi.key]+=Number(x.points||0);p.pf[yi.key]+=Number(y.points||0);
    let wk=null;if(+x.points>+y.points){p.wins[xi.key]++;wk=xi.key}else if(+y.points>+x.points){p.wins[yi.key]++;wk=yi.key}else p.ties++;
    const margin=Math.abs((+x.points||0)-(+y.points||0));const game={season:s.league.season,week:w.week,x:xi,y:yi,xp:+x.points||0,yp:+y.points||0,margin,winnerKey:wk};
    if(!p.biggest||margin>p.biggest.margin)p.biggest=game;if(!p.closest||margin<p.closest.margin)p.closest=game;
    const isPO=Number(w.week)>=poStart;if(isPO){p.playoffGames++;if(wk)p.playoffWins[wk]++;if(champWeek&&Number(w.week)===champWeek)p.titleGames++}
    if(wk){if(p.streakKey===wk)p.streakN++;else{p.streakKey=wk;p.streakN=1}if(p.streakN>p.bestStreak.n)p.bestStreak={key:wk,n:p.streakN}}else{p.streakKey=null;p.streakN=0}
    p.last={...game,isPO,isTitle:!!(champWeek&&Number(w.week)===champWeek)};
   }
  }
 }
 return [...pairs.values()].map(p=>({...p,avgMargin:p.games?Math.abs(p.pf[p.a]-p.pf[p.b])/p.games:0})).sort((a,b)=>b.games-a.games||b.playoffGames-a.playoffGames);
}

 return `<div class="grid"><section class="card span12"><div class="section-title"><h2>Awards, Superlatives & Era Leaders</h2><small>Calculated from locally cached history</small></div><div class="era-controls"><label>Era Start<select class="select" id="eraStart">${opts}</select></label><label>Era End<select class="select" id="eraEnd">${opts}</select></label><button class="btn" id="eraAll">All Loaded Seasons</button></div><div class="postseason-note">Era leaderboards use only seasons inside the selected range. “Overachiever” compares regular-season standing with points-for rank; “Underachiever” is the reverse. These are descriptive statistical labels, not subjective awards.</div></section>
 <section class="card span12"><div class="section-title"><h2>Era Leaders: ${Math.min(...selected.map(s=>Number(s.league.season)))}–${Math.max(...selected.map(s=>Number(s.league.season)))}</h2><small>${selected.length} season${selected.length===1?'':'s'}</small></div><div class="era-leader-grid">${leader('Championships',byTitles,x=>`${x.titles} title${x.titles===1?'':'s'}`)}${leader('Regular-Season Wins',byWins,x=>`${x.w} wins`)}${leader('Win Percentage',byPct,x=>`${(x.wp*100).toFixed(1)}% (${x.games} G)`)}${leader('Points Scored',byPF,x=>`${fmt(x.pf)} PF`)}${leader('Playoff Appearances',byPlayoffs,x=>`${x.playoffs} apps`)}</div></section>
 <section class="card span12"><div class="section-title"><h2>Season Superlatives</h2><small>One snapshot for every season in the selected era</small></div>${awards.map(a=>`<article class="award-season"><div class="award-season-head"><h3 style="margin:0">${a.season}</h3>${a.champion?'<span class="award-badge">🏆 '+esc(a.champion)+'</span>':''}</div><div class="award-grid"><div class="award-card"><div class="tiny muted">Champion</div><div class="award-winner gold">${esc(a.champion||'—')}</div><div class="tiny muted">Runner-up: ${esc(a.runner||'—')}</div></div><div class="award-card"><div class="tiny muted">Regular-Season King</div><div class="award-winner">${esc(a.regular||'—')}</div></div><div class="award-card"><div class="tiny muted">Scoring Crown</div><div class="award-winner">${esc(a.highPF?.name||'—')}</div><div class="tiny muted">${a.highPF?fmt(a.highPF.value)+' PF':''}</div></div><div class="award-card"><div class="tiny muted">Schedule Grinder</div><div class="award-winner">${esc(a.tough?.name||'—')}</div><div class="tiny muted">${a.tough?fmt(a.tough.value)+' PA':''}</div></div><div class="award-card"><div class="tiny muted">Biggest Overachiever</div><div class="award-winner">${esc(a.over?.name||'—')}</div><div class="tiny muted">${a.over?`finished ${a.over.delta} place${Math.abs(a.over.delta)===1?'':'s'} better than PF rank`:''}</div></div><div class="award-card"><div class="tiny muted">Biggest Underachiever</div><div class="award-winner">${esc(a.under?.name||'—')}</div><div class="tiny muted">${a.under?`finished ${a.under.delta} place${Math.abs(a.under.delta)===1?'':'s'} worse than PF rank`:''}</div></div><div class="award-card"><div class="tiny muted">Best Draft Value</div><div class="award-winner">${esc(a.draftWinner?.name||'Not enough cached player-point data')}</div><div class="tiny muted">${a.draftWinner?`avg value ${(a.draftWinner.sum/a.draftWinner.n)>=0?'+':''}${(a.draftWinner.sum/a.draftWinner.n).toFixed(1)} • ${a.draftWinner.hits} hits`:''}</div></div><div class="award-card"><div class="tiny muted">Biggest Beatdown</div><div class="award-winner">${esc(a.biggest?.name||'—')}</div><div class="tiny muted">${a.biggest?`${fmt(a.biggest.margin)}-point margin • Week ${a.biggest.week}`:''}</div></div></div></article>`).join('')}</section></div>`;
}


function seasonStorylineData(s){
 const a=seasonAwardData(s), st=standings(s), champ=championshipSummary(s), tx=[];
 for(const w of (s.transactionWeeks||[]))for(const tr of (w.transactions||[]))tx.push({week:Number(w.week)||0,tr});
 const trades=tx.filter(x=>String(x.tr.type||'').toLowerCase()==='trade');
 const waivers=tx.filter(x=>String(x.tr.type||'').toLowerCase()==='waiver');
 const freeAgents=tx.filter(x=>String(x.tr.type||'').toLowerCase()==='free_agent');
 const biggestBid=tx.map(x=>({week:x.week,bid:Number(x.tr.settings?.waiver_bid??x.tr.settings?.waiver_amount??0)||0,tr:x.tr})).sort((x,y)=>y.bid-x.bid)[0]||null;
 const dv=historicalDraftValue().rows.filter(x=>String(x.season)===String(s.league.season));
 const bestPick=dv.length?[...dv].sort((x,y)=>y.valueDelta-x.valueDelta||y.points-x.points)[0]:null;
 const worstPick=dv.length?[...dv].sort((x,y)=>x.valueDelta-y.valueDelta||x.points-y.points)[0]:null;
 let highGame=null, closeGame=null, highLoss=null;
 for(const w of s.matchupWeeks||[])for(const [,g] of groupedMatchups(w)){
   if(g.length<2)continue;
   const [x,y]=g, xp=Number(x.points)||0, yp=Number(y.points)||0;
   const xi=identityForRoster(s,x.roster_id), yi=identityForRoster(s,y.roster_id);
   for(const z of [{name:xi.name,opp:yi.name,score:xp,oppScore:yp},{name:yi.name,opp:xi.name,score:yp,oppScore:xp}]){
     if(!highGame||z.score>highGame.score)highGame={...z,week:w.week};
     if(z.score<z.oppScore&&(!highLoss||z.score>highLoss.score))highLoss={...z,week:w.week};
   }
   const margin=Math.abs(xp-yp);
   if(!closeGame||margin<closeGame.margin)closeGame={margin,week:w.week,a:xi.name,b:yi.name,aScore:xp,bScore:yp};
 }
 const winner=st[0]||null, last=st[st.length-1]||null;
 return {a,st,champ,tx,trades,waivers,freeAgents,biggestBid,bestPick,worstPick,highGame,closeGame,highLoss,winner,last};
}
function storylineParagraphs(s){
 const d=seasonStorylineData(s), y=String(s.league.season), p=[];
 if(d.champ){
   let score='';
   if(d.champ.winnerScore!=null&&d.champ.runnerScore!=null)score=` ${fmt(d.champ.winnerScore)}–${fmt(d.champ.runnerScore)}`;
   p.push(`<b>${esc(d.champ.winnerName)}</b> finished ${y} as UCL champion, defeating <b>${esc(d.champ.runnerName)}</b>${score}${d.champ.week?` in Week ${esc(d.champ.week)}`:''}.`);
 }else if(d.winner){
   p.push(`<b>${esc(managerName(d.winner.u,d.winner.r))}</b> led the recorded regular-season standings at ${d.winner.r.settings?.wins||0}-${d.winner.r.settings?.losses||0}-${d.winner.r.settings?.ties||0}. The cached bracket does not identify a championship result.`);
 }
 if(d.a.highPF)p.push(`<b>${esc(d.a.highPF.name)}</b> won the scoring crown with ${fmt(d.a.highPF.value)} points.`);
 if(d.a.biggest)p.push(`The season's biggest recorded beatdown belonged to <b>${esc(d.a.biggest.name)}</b>, a ${fmt(d.a.biggest.margin)}-point win in Week ${esc(d.a.biggest.week)}.`);
 if(d.highGame)p.push(`The highest single-team score in the cached matchup archive was <b>${fmt(d.highGame.score)}</b> by ${esc(d.highGame.name)} against ${esc(d.highGame.opp)} in Week ${esc(d.highGame.week)}.`);
 if(d.highLoss)p.push(`The season's toughest high-scoring loss was ${esc(d.highLoss.name)} putting up <b>${fmt(d.highLoss.score)}</b> and still losing to ${esc(d.highLoss.opp)}.`);
 if(d.closeGame)p.push(`The closest recorded matchup was ${esc(d.closeGame.a)} vs. ${esc(d.closeGame.b)} in Week ${esc(d.closeGame.week)}, decided by just <b>${fmt(d.closeGame.margin)}</b> points.`);
 if(d.a.over&&d.a.over.delta>0)p.push(`<b>${esc(d.a.over.name)}</b> was the biggest standings overachiever, finishing ${d.a.over.delta} place${d.a.over.delta===1?'':'s'} better than its points-for rank.`);
 if(d.a.under&&d.a.under.delta>0)p.push(`<b>${esc(d.a.under.name)}</b> was the biggest standings underachiever, finishing ${d.a.under.delta} place${d.a.under.delta===1?'':'s'} below its points-for rank.`);
 if(d.bestPick)p.push(`Draft-value leader: <b>${esc(d.bestPick.player.name)}</b> by ${esc(d.bestPick.manager.name)} at pick #${esc(d.bestPick.pick.pick_no)}, finishing ${d.bestPick.valueDelta>=0?'+':''}${fmt(d.bestPick.valueDelta)} slots versus captured fantasy-point rank.`);
 if(d.tx.length){
   p.push(`League activity produced <b>${d.tx.length}</b> cached transactions: ${d.trades.length} trade${d.trades.length===1?'':'s'}, ${d.waivers.length} waiver claim${d.waivers.length===1?'':'s'}, and ${d.freeAgents.length} free-agent move${d.freeAgents.length===1?'':'s'}.`);
   if(d.biggestBid?.bid>0)p.push(`The largest recorded waiver bid was <b>${fmt(d.biggestBid.bid)}</b> FAAB in Week ${esc(d.biggestBid.week)}.`);
 }
 return p;
}
function viewStorylines(){
 const seasons=[...state.seasons].sort((a,b)=>Number(b.league.season)-Number(a.league.season));
 if(!seasons.length)return '<div class="card empty">No seasons loaded.</div>';
 return `<div class="grid">
 <section class="card span12"><div class="section-title"><h2>Season Storylines</h2><small>Automatically generated retrospectives from the locally cached league archive</small></div>
 <p class="muted">These summaries use recorded standings, matchup scores, postseason brackets, draft-value calculations, and cached transaction history. Missing API payloads are omitted rather than guessed.</p></section>
 ${seasons.map(s=>{const d=seasonStorylineData(s),pars=storylineParagraphs(s);return `<section class="card span12">
   <div class="section-title"><h2>${esc(s.league.season)} UCL Season</h2><small>${d.champ?`Champion: ${esc(d.champ.winnerName)}`:'Recorded season retrospective'}</small></div>
   <div class="storyline-kpis kpis">
    <div class="kpi"><div class="l">Champion</div><div class="v gold">${esc(d.champ?.winnerName||'Not identified')}</div></div>
    <div class="kpi"><div class="l">Scoring Crown</div><div class="v">${esc(d.a.highPF?.name||'—')}</div><div class="tiny muted">${d.a.highPF?fmt(d.a.highPF.value):''}</div></div>
    <div class="kpi"><div class="l">Best Draft</div><div class="v">${esc(d.a.draftWinner?.name||'—')}</div></div>
    <div class="kpi"><div class="l">Transactions</div><div class="v">${d.tx.length}</div></div>
   </div>
   <div style="margin-top:14px">${pars.map(x=>`<p style="line-height:1.6;margin:.55rem 0">${x}</p>`).join('')||'<div class="empty">Not enough cached data to build a retrospective.</div>'}</div>
   ${d.bestPick||d.worstPick?`<div class="mini-grid" style="margin-top:14px">
    ${d.bestPick?`<div class="mini"><div class="tiny muted">Draft Steal</div><b>${esc(d.bestPick.player.name)}</b><div class="tiny">${esc(d.bestPick.manager.name)} • #${esc(d.bestPick.pick.pick_no)} • ${d.bestPick.valueDelta>=0?'+':''}${fmt(d.bestPick.valueDelta)} value</div></div>`:''}
    ${d.worstPick?`<div class="mini"><div class="tiny muted">Draft Miss</div><b>${esc(d.worstPick.player.name)}</b><div class="tiny">${esc(d.worstPick.manager.name)} • #${esc(d.worstPick.pick.pick_no)} • ${d.worstPick.valueDelta>=0?'+':''}${fmt(d.worstPick.valueDelta)} value</div></div>`:''}
   </div>`:''}
 </section>`}).join('')}
 </div>`;
}
function teamDetail(rosterId){const s=season(),{ownerByRoster}=mapping(s),r=s.rosters.find(x=>x.roster_id===+rosterId),u=ownerByRoster.get(+rosterId);if(!r)return;const picks=s.draftPicks.flatMap(d=>d.picks||[]).filter(p=>p.roster_id===+rosterId&&validPlayerPick(p));const games=[];for(const w of s.matchupWeeks){for(const [,a] of groupedMatchups(w)){const mine=a.find(x=>x.roster_id===+rosterId),opp=a.find(x=>x.roster_id!==+rosterId);if(mine&&opp)games.push({w:w.week,mine,opp,on:managerName(ownerByRoster.get(opp.roster_id),s.rosters.find(r=>r.roster_id===opp.roster_id))})}}$('#content').innerHTML=`<div class="grid"><section class="card span12"><button class="btn" id="backTeams">← Back</button><h2>${esc(managerName(u,r))} — ${s.league.season}</h2>${identityHtml(s,r.roster_id)}<div class="kpis"><div class="kpi"><div class="l">Record</div><div class="v">${r.settings?.wins||0}-${r.settings?.losses||0}-${r.settings?.ties||0}</div></div><div class="kpi"><div class="l">Points For</div><div class="v">${fmt(pf(r.settings))}</div></div><div class="kpi"><div class="l">Points Against</div><div class="v">${fmt(pa(r.settings))}</div></div><div class="kpi"><div class="l">Draft Picks</div><div class="v">${picks.length}</div></div></div></section><section class="card span8"><div class="section-title"><h2>Draft Picks</h2><small>Season position mix and pick order</small></div>${(()=>{const pc=positionCounts(picks);return `<div class="draft-summary"><div class="kpi"><div class="l">Top Position</div><div class="v">${esc(pc[0]?.[0]||'—')}</div></div><div class="kpi"><div class="l">First Pick</div><div class="v">${picks.length?'#'+Math.min(...picks.map(p=>Number(p.pick_no)||999)): '—'}</div></div><div class="kpi"><div class="l">Positions</div><div class="v">${pc.length}</div></div></div><div class="identity-badges">${pc.map(([p,c])=>`<span class="pill">${esc(p)} ${c}</span>`).join('')}</div>`})()}<table class="stack-table"><thead><tr><th>Pick</th><th>Player</th><th>Pos</th></tr></thead><tbody>${picks.map(p=>{const pl=playerLabel(p);return`<tr><td data-label="Pick">${p.pick_no}</td><td data-label="Player">${esc(pl.name)}</td><td data-label="Position">${esc(pl.pos)}</td></tr>`}).join('')||'<tr><td colspan="3">No picks.</td></tr>'}</tbody></table></section><section class="card span4"><div class="section-title"><h2>Schedule</h2></div>${games.map(g=>`<div class="matchup"><div>W${g.w} vs ${esc(g.on)}</div><b class="${+g.mine.points>+g.opp.points?'good':+g.mine.points<+g.opp.points?'bad':''}">${fmt(g.mine.points)} – ${fmt(g.opp.points)}</b></div>`).join('')||'<div class="empty">No games.</div>'}</section></div>`;$('#backTeams').onclick=()=>{state.tab='teams';render()}}
$('#syncBtn').onclick=sync;$('#clearBtn').onclick=async()=>{const root=$('#leagueId').value.trim();try{await idbDelete(root)}catch{}try{localStorage.removeItem(cacheKey(root));localStorage.removeItem(cacheMetaKey(root))}catch{}state.seasons=[];state.active=null;state.cacheMeta={};status('Saved local league history cleared. No Sleeper request was made.');render()};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render()};
const mobileNav=$('#mobileNav'),mobileToggle=$('#mobileNavToggle');
if(mobileToggle)mobileToggle.onclick=()=>{const open=mobileNav.classList.toggle('open');mobileToggle.setAttribute('aria-expanded',String(open))};
if(mobileNav)mobileNav.onclick=e=>{const b=e.target.closest('[data-mobile-tab]');if(!b)return;state.tab=b.dataset.mobileTab;render();mobileNav.classList.remove('open');mobileToggle?.setAttribute('aria-expanded','false')};
$('#seasonStrip').onclick=e=>{const b=e.target.closest('[data-season]');if(!b)return;state.active=b.dataset.season;render()};
$('#content').addEventListener('change',e=>{if(e.target?.id==='ctespnSeason'){state.ctespnSeason=e.target.value||'all';render();return}if(e.target?.id==='ctespnManager'){state.ctespnManager=e.target.value||'';render();return}});
$('#content').onclick=e=>{if(e.target.closest('[data-empty-backup]')){state.tab='backup';render();return;}if(e.target.closest('#ctespnReset')){state.ctespnSeason='all';state.ctespnManager='';render();return}const dash=e.target.closest('[data-dash-tab]');if(dash){state.tab=dash.dataset.dashTab;render();return}const t=e.target.closest('[data-roster]');if(t)teamDetail(t.dataset.roster);const all=e.target.closest('#eraAll');if(all){const ys=state.seasons.map(s=>Number(s.league.season));state.eraStart=Math.min(...ys);state.eraEnd=Math.max(...ys);render()}if(e.target.closest('#backupDownload'))downloadBackup();if(e.target.closest('#backupChoose'))$('#backupFile')?.click();const ce=e.target.closest('[data-ctespn-export]');if(ce){exportCTESPN(ce.dataset.ctespnExport);return}const cc=e.target.closest('[data-ctespn-copy]');if(cc){copyCTESPN(cc.dataset.ctespnCopy);return}const sr=e.target.closest('[data-search-tab]');if(sr){if(sr.dataset.searchSeason)state.active=sr.dataset.searchSeason;state.tab=sr.dataset.searchTab;render()}if(e.target.closest('#historySearchBtn')){state.searchQuery=$('#historySearch')?.value||'';render()}if(e.target.closest('#historySearchClear')){state.searchQuery='';render()}const ph=e.target.closest('[data-player-history]');if(ph){state.playerSelected=ph.dataset.playerHistory;state.tab='players';render()}if(e.target.closest('#playerBack')){state.playerSelected='';render()}if(e.target.closest('#playerHistorySearchBtn')){state.playerQuery=$('#playerHistorySearch')?.value||'';state.playerSelected='';render()}if(e.target.closest('#playerHistoryClear')){state.playerQuery='';state.playerSelected='';render()}};
$('#content').onchange=e=>{if(e.target.id==='eraStart'){state.eraStart=Number(e.target.value);render()}if(e.target.id==='eraEnd'){state.eraEnd=Number(e.target.value);render()}if(e.target.id==='backupFile'){const f=e.target.files?.[0];importBackupFile(f)}if(e.target.id==='compareA'){state.compareA=e.target.value;render()}if(e.target.id==='compareB'){state.compareB=e.target.value;render()}if(e.target.id==='legacyManagerSelect'){state.legacyManager=e.target.value;render()}};
$('#content').onkeydown=e=>{if(e.target.id==='historySearch'&&e.key==='Enter'){e.preventDefault();state.searchQuery=e.target.value;render()}if(e.target.id==='playerHistorySearch'&&e.key==='Enter'){e.preventDefault();state.playerQuery=e.target.value;state.playerSelected='';render()}};
loadCache().finally(()=>render());
</script>
