<script>
const API='https://api.sleeper.app/v1';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const state={seasons:[],active:null,tab:'overview',navHub:'home',players:{},loadedPlayers:false,backupMessage:'',searchQuery:'',compareA:'',compareB:'',playerQuery:'',playerSelected:'',playerLegacySelected:'',playoffPathManager:'',eraSelected:'',timelineType:'all',timelineStart:'',timelineEnd:'',advSearchQuery:'',advSearchType:'all',advSearchManager:'all',advSearchSeason:'all',advSearchTxn:'all',advSearchRound:'all',advSearchPlayoff:'all',advSearchMinScore:'',advSearchMaxMargin:'',ctespnSeason:'all',ctespnManager:'',ctespnSource:'summary',ctespnPlayer:'',ctespnGame:'',ctespnRivalry:'',ctespnRecord:'',legacyManager:'',tendencyManager:'',seasonCompareA:'',seasonCompareB:'',powerSeason:'',powerStart:'',powerEnd:'',managerSeasonRoster:'',lineupManager:'',maintenanceMessage:'',maintenanceSeason:'',maintenanceWeek:'',maintenanceGame:'',maintenanceNoteSeason:'',maintenanceNoteCategory:'General',maintenanceNoteText:'',recordCategory:'highest-score',recordLimit:'10',recordSeason:'all',recordManager:'all',compareMode:'manager',comparePlayerA:'',comparePlayerB:'',historyWeekOffset:0,cacheMeta:{}};
window.state=state;
const cacheKey=id=>`ucl_history_${id}_v1`;
const cacheMetaKey=id=>`ucl_history_${id}_meta_v1`;
const DB_NAME='ucl_league_history_db_v1', DB_STORE='archives';
function openHistoryDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'rootLeagueId'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('IndexedDB could not be opened.'))})}
async function idbGet(root){const db=await openHistoryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(String(root));req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function idbPut(root,seasons,meta={}){const db=await openHistoryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put({rootLeagueId:String(root),seasons,meta,updatedAt:Date.now()});tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{const e=tx.error;db.close();reject(e||new Error('IndexedDB write failed.'))};tx.onabort=()=>{const e=tx.error;db.close();reject(e||new Error('IndexedDB write was aborted.'))}})}
async function idbDelete(root){const db=await openHistoryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(String(root));tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{const e=tx.error;db.close();reject(e)}})}
function stamp(ts){if(!ts)return 'Never';try{return new Date(ts).toLocaleString()}catch{return 'Unknown'}}
const fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const pct=(w,l,t=0)=>{const g=w+l+t;return g?((w+t*.5)/g).toFixed(3).replace(/^0/,''):'.000'};
async function j(url){const r=await fetch(url);if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
function status(msg,err=false){$('#status').innerHTML=err?`<span class="error">${esc(msg)}</span>`:msg}
function teamName(user,roster){return user?.metadata?.team_name || user?.display_name || user?.username || `Roster ${roster?.roster_id??'?'}`}
function managerName(user,roster){return user?.username || user?.display_name || user?.metadata?.team_name || `Roster ${roster?.roster_id??'?'}`}
function managerNameForRoster(s,rosterId){const {ownerByRoster,rm}=mapping(s),u=ownerByRoster.get(Number(rosterId)),r=rm.get(Number(rosterId));const snap=identitySnapshotForRoster(s,rosterId);return snap?.username||u?.username||u?.display_name||snap?.team_name||teamName(u,r)}
function buildIdentitySnapshot(users=[],rosters=[]){
  const um=new Map(users.map(u=>[u.user_id,u]));
  return rosters.map(r=>{const u=um.get(r.owner_id)||{};return {season_roster_id:r.roster_id,user_id:u.user_id||r.owner_id||null,username:u.username||'',display_name:u.display_name||'',team_name:u.metadata?.team_name||'',roster_id:r.roster_id,owner_id:r.owner_id||null}})
}
function ensureIdentitySnapshot(s){if(!Array.isArray(s.identities)||!s.identities.length)s.identities=buildIdentitySnapshot(s.users||[],s.rosters||[]);return s.identities}
function identitySnapshotForRoster(s,rosterId){return ensureIdentitySnapshot(s).find(x=>Number(x.roster_id)===Number(rosterId))||null}
function identitySubline(s,rosterId){const i=identitySnapshotForRoster(s,rosterId);if(!i)return '';const parts=[];if(i.team_name)parts.push(i.team_name);if(i.display_name && i.display_name!==i.username && i.display_name!==i.team_name)parts.push(i.display_name);return parts.join(' • ')}
function identityHtml(s,rosterId){const t=identitySubline(s,rosterId);return t?`<div class="identity-line">${esc(t)}</div>`:''}


function maintenanceState(){
  if(!state.cacheMeta||typeof state.cacheMeta!=='object')state.cacheMeta={};
  if(!state.cacheMeta.maintenance||typeof state.cacheMeta.maintenance!=='object'){
    state.cacheMeta.maintenance={ignoredGames:[],ignoredTransactions:[],ignoredPlayers:[],notes:[],updatedAt:null};
  }
  const m=state.cacheMeta.maintenance;
  if(!Array.isArray(m.ignoredGames))m.ignoredGames=[];
  if(!Array.isArray(m.ignoredTransactions))m.ignoredTransactions=[];
  if(!Array.isArray(m.ignoredPlayers))m.ignoredPlayers=[];
  if(!Array.isArray(m.notes))m.notes=[];
  return m;
}
function maintenanceGameKey(s,a,b){
  const season=String(s?.league?.season||'');
  const rows=[a,b].filter(Boolean).map(x=>`${Number(x.roster_id)||0}:${Number(x.points)}`).sort();
  return `${season}|${rows.join('|')}`;
}
function maintenanceGameIgnored(s,a,b){return maintenanceState().ignoredGames.includes(maintenanceGameKey(s,a,b))}
function maintenanceTxnKey(season,week,tr){return `${season}|${Number(week)||0}|${tr?.transaction_id||tr?.created||'unknown'}`}
function maintenanceTxnIgnored(season,week,tr){return maintenanceState().ignoredTransactions.includes(maintenanceTxnKey(season,week,tr))}
function maintenancePlayerIgnored(pid){return maintenanceState().ignoredPlayers.includes(String(pid))}
async function saveMaintenance(message='Maintenance rules saved.'){
  const root=$('#leagueId').value.trim();
  const m=maintenanceState();m.updatedAt=Date.now();state.cacheMeta.maintenance=m;
  try{
    await idbPut(root,state.seasons,state.cacheMeta);
    try{localStorage.setItem(cacheMetaKey(root),JSON.stringify({...state.cacheMeta,storage:'indexeddb'}))}catch{}
    if(typeof __uclPerf!=='undefined'&&__uclPerf.cache)__uclPerf.cache.clear();
    state.maintenanceMessage=message;render();
  }catch(e){state.maintenanceMessage=`Could not save maintenance rules: ${e.message}`;render()}
}
function maintenanceIgnoredGameLabel(key){
  const [season,...rest]=String(key).split('|');
  const parts=rest.map(x=>x.split(':'));
  const s=state.seasons.find(x=>String(x?.league?.season||'')===season);
  const names=parts.map(([rid,pts])=>`${s?managerNameForRoster(s,Number(rid)):'Roster '+rid} ${pts}`);
  return `${season} • ${names.join(' vs ')}`;
}

function pf(settings){return Number(settings?.fpts||0)+Number(settings?.fpts_decimal||0)/100}
function pa(settings){return Number(settings?.fpts_against||0)+Number(settings?.fpts_against_decimal||0)/100}
async function fetchSeason(id){
  const league=await j(`${API}/league/${id}`);
  const [users,rosters,drafts,winners,losers]=await Promise.all([
    j(`${API}/league/${id}/users`).catch(()=>[]),j(`${API}/league/${id}/rosters`).catch(()=>[]),j(`${API}/league/${id}/drafts`).catch(()=>[]),j(`${API}/league/${id}/winners_bracket`).catch(()=>[]),j(`${API}/league/${id}/losers_bracket`).catch(()=>[])
  ]);
  const draftPicks=[]; for(const d of drafts){const picks=await j(`${API}/draft/${d.draft_id}/picks`).catch(()=>[]);draftPicks.push({draft:d,picks})}
  const matchupWeeks=[]; const transactionWeeks=[]; const weeks=Math.max(18,Number(league.settings?.playoff_week_start||15)+3);
  for(let w=1;w<=weeks;w++){
    const [m,tr]=await Promise.all([
      j(`${API}/league/${id}/matchups/${w}`).catch(()=>[]),
      j(`${API}/league/${id}/transactions/${w}`).catch(()=>[])
    ]);
    if(m?.length) matchupWeeks.push({week:w,matchups:m});
    if(tr?.length) transactionWeeks.push({week:w,transactions:tr});
  }
  const identities=buildIdentitySnapshot(users,rosters);
  return {id,league,users,rosters,identities,draftPicks,winners,losers,matchupWeeks,transactionWeeks,fetchedAt:Date.now()};
}
async function sync(){
  const root=$('#leagueId').value.trim(); if(!root)return;
  $('#syncBtn').disabled=true;
  const previous=state.seasons;
  try{
    const fresh=[];let id=root,seen=new Set(),guard=0;
    while(id && id!=='0' && !seen.has(id) && guard<30){
      seen.add(id);guard++;
      status(`<span class="loading">Manually syncing Sleeper season ${guard}… Saved data remains available until sync completes.</span>`);
      const s=await fetchSeason(id);fresh.push(s);id=s.league.previous_league_id;
    }
    fresh.sort((a,b)=>Number(b.league.season)-Number(a.league.season));
    state.seasons=fresh;state.active=fresh[0]?.league.season||null;
    const syncedAt=Date.now();
    state.cacheMeta={syncedAt,seasonCount:fresh.length,rootLeagueId:root};
    await idbPut(root,fresh,state.cacheMeta);
    try{localStorage.setItem(cacheMetaKey(root),JSON.stringify({...state.cacheMeta,storage:'indexeddb'}))}catch{}
    try{localStorage.removeItem(cacheKey(root))}catch{}
    status(`Saved <b>${fresh.length}</b> linked season${fresh.length===1?'':'s'} in the browser database. Last Sleeper sync: <b>${esc(stamp(syncedAt))}</b>. No further Sleeper is contacted only when you choose Sync.`);
    render();
  }catch(e){
    state.seasons=previous;
    status(`Sync failed: ${e.message}. Your previously saved history was kept unchanged.`,true);render();
  }finally{$('#syncBtn').disabled=false}
}
async function loadCache(root=$('#leagueId').value.trim()){
  try{
    let record=await idbGet(root);
    if(!record){
      // Backward-compatible one-time migration from older localStorage builds.
      try{
        const legacy=JSON.parse(localStorage.getItem(cacheKey(root))||'[]');
        const legacyMeta=JSON.parse(localStorage.getItem(cacheMetaKey(root))||'{}');
        if(Array.isArray(legacy)&&legacy.length){
          record={rootLeagueId:root,seasons:legacy,meta:legacyMeta};
          await idbPut(root,legacy,legacyMeta);
          try{localStorage.removeItem(cacheKey(root));localStorage.setItem(cacheMetaKey(root),JSON.stringify({...legacyMeta,storage:'indexeddb'}))}catch{}
        }
      }catch{}
    }
    const x=record?.seasons||[];const meta=record?.meta||{};
    if(x.length){
      x.forEach(ensureIdentitySnapshot);
      state.seasons=x;state.active=x[0].league.season;state.cacheMeta=meta;
      const backup=Math.max(...x.map(s=>Number(s.fetchedAt||0)),0);
      const last=meta.syncedAt||backup;
      status(`Loaded <b>${x.length}</b> season${x.length===1?'':'s'} entirely from the browser database. Last Sleeper sync: <b>${esc(stamp(last))}</b>. Sync only occurs when you choose it.`);
      render();return true;
    }
  }catch(e){status(`Saved history could not be read: ${e.message}`,true)}
  status('No saved league history found. You can restore a backup immediately or press <b>Sync from Sleeper</b> once to capture it locally.');
  return false;
}
function season(){return state.seasons.find(x=>String(x.league.season)===String(state.active))||state.seasons[0]}
function mapping(s){const um=new Map(s.users.map(u=>[u.user_id,u]));const rm=new Map(s.rosters.map(r=>[r.roster_id,r]));const ownerByRoster=new Map(s.rosters.map(r=>[r.roster_id,um.get(r.owner_id)]));return{um,rm,ownerByRoster}}
function placementMap(s){const p=new Map();for(const m of s.winners||[]){if(m.p){if(m.w)p.set(m.w,Number(m.p));if(m.l)p.set(m.l,Number(m.p)+1)}}return p}
function standings(s){const {ownerByRoster}=mapping(s), pm=placementMap(s);return [...s.rosters].sort((a,b)=>{const aw=a.settings?.wins||0,bw=b.settings?.wins||0;if(bw!==aw)return bw-aw;return pf(b.settings)-pf(a.settings)}).map((r,i)=>({r,u:ownerByRoster.get(r.roster_id),rank:i+1,place:pm.get(r.roster_id)}))}

function bytesLabel(n){n=Number(n||0);if(n<1024)return `${n} B`;if(n<1024*1024)return `${(n/1024).toFixed(1)} KB`;return `${(n/1024/1024).toFixed(2)} MB`}
function backupData(root=$('#leagueId').value.trim()){
  const meta=state.cacheMeta||{};
  return {format:'UCL_LEAGUE_HISTORY_BACKUP',schemaVersion:1,appVersion:'1.78',exportedAt:Date.now(),rootLeagueId:root,meta,seasons:state.seasons};
}
function downloadBackup(){
  const root=$('#leagueId').value.trim();
  if(!state.seasons.length){state.backupMessage='There is no cached league history to export yet.';render();return}
  try{
    const data=backupData(root);const json=JSON.stringify(data);const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');const years=state.seasons.map(s=>Number(s.league?.season)).filter(Number.isFinite).sort((a,b)=>a-b);
    a.href=url;a.download=`ucl-league-history-${years[0]||'history'}-${years.at(-1)||'latest'}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    state.backupMessage=`Backup created: ${state.seasons.length} seasons, ${bytesLabel(new Blob([json]).size)}.`;render();
  }catch(e){state.backupMessage=`Backup failed: ${e.message}`;render()}
}
function validateBackupData(data){
  if(!data||data.format!=='UCL_LEAGUE_HISTORY_BACKUP')throw new Error('This is not a UCL League History backup file.');

function playerLegacyData(){

   const bestManager=[...p.managers].sort((a,b)=>Number(b.points)-Number(a.points)||b.starts-a.starts||b.rosterWeeks-a.rosterWeeks)[0]||null;
   const appearances=champByPlayer.get(String(p.id))||[];
   const titleSeasons=[...new Set(appearances.map(a=>a.season))].sort();

   const titlePoints=appearances.reduce((n,a)=>n+(Number(a.points)||0),0);
   const adds=p.transactions.filter(t=>t.type==='add').length,drops=p.transactions.filter(t=>t.type==='drop').length;

   const lastSeason=[...p.seasons].map(Number).filter(Number.isFinite).sort((a,b)=>a-b).at(-1)||null;
   const years=[...new Set([
     ...p.seasonRows.map(r=>String(r.season)),
     ...p.drafts.map(d=>String(d.season)),
     ...p.transactions.map(t=>String(t.season)),
     ...appearances.map(a=>String(a.season))
   ])].sort((a,b)=>Number(b)-Number(a));
   const timeline=years.map(year=>{
     const usage=p.seasonRows.find(r=>String(r.season)===year)||null;

     const tx=p.transactions.filter(t=>String(t.season)===year);

   return {...p,bestSeason,bestManager,champAppearances:appearances,titleSeasons,titleStarts,titlePoints,adds,drops,firstSeason,lastSeason,timeline};
 });

function playerInterestingStats(all){

 const enrich=p=>({...p,adds:p.transactions.filter(t=>t.type==='add').length,drops:p.transactions.filter(t=>t.type==='drop').length,churn:p.transactions.length,benchWeeks:Math.max(0,p.rosterWeeks-p.starts),startPct:p.rosterWeeks?p.starts/p.rosterWeeks:0,benchPct:p.rosterWeeks?Math.max(0,p.rosterWeeks-p.starts)/p.rosterWeeks:0});

 return {

  mostTraveled:top([...allx].filter(p=>p.managers.length>1).sort((a,b)=>b.managers.length-a.managers.length||b.seasons.size-a.seasons.size||b.rosterWeeks-a.rosterWeeks)),
  highestStart:top([...withRate].sort((a,b)=>b.startPct-a.startPct||b.starts-a.starts||b.rosterWeeks-a.rosterWeeks)),
  benchBoss:top([...withRate].sort((a,b)=>b.benchPct-a.benchPct||b.benchWeeks-a.benchWeeks||b.rosterWeeks-a.rosterWeeks)),
  neverStarted:top([...allx].filter(p=>p.rosterWeeks>=4&&p.starts===0).sort((a,b)=>b.rosterWeeks-a.rosterWeeks||b.seasons.size-a.seasons.size)),

 };
}

function seasonConfidence(s,domain='general'){
 const reasons=[]; let score=100;
 const rosters=Array.isArray(s.rosters)?s.rosters:[], users=Array.isArray(s.users)?s.users:[], weeks=Array.isArray(s.matchupWeeks)?s.matchupWeeks:[];
 const userIds=new Set(users.map(u=>String(u.user_id))); const rosterIds=new Set(rosters.map(r=>Number(r.roster_id)));
 const unmatched=rosters.filter(r=>r.owner_id&&!userIds.has(String(r.owner_id))).length;if(unmatched){score-=25;reasons.push(`${unmatched} unmatched roster owner${unmatched===1?'':'s'}`)}
 const ids=ensureIdentitySnapshot(s);if(ids.length<rosters.length){score-=10;reasons.push('incomplete identity snapshot')}
 if(['general','matchups','players','records','rivalries','luck'].includes(domain)){
   if(!weeks.length){score-=65;reasons.push('no matchup history')}else{
     const nums=weeks.map(w=>Number(w.week)).filter(Number.isFinite).sort((a,b)=>a-b), max=nums.length?Math.max(...nums):0, missing=[];for(let w=1;w<=max;w++)if(!nums.includes(w))missing.push(w);
     if(missing.length){score-=Math.min(20,missing.length*4);reasons.push(`${missing.length} missing matchup week${missing.length===1?'':'s'}`)}
     let partial=0,dupes=0,badGroups=0;
     for(const w of weeks){const ms=Array.isArray(w.matchups)?w.matchups:[];if(ms.length&&ms.length<rosters.length)partial++;const rr=ms.map(x=>Number(x?.roster_id)).filter(Number.isFinite);dupes+=rr.length-new Set(rr).size;for(const [,g] of groupedMatchups({matchups:ms}))if(g.length!==2)badGroups++;}
     if(partial){score-=Math.min(15,partial*3);reasons.push(`${partial} partial matchup week${partial===1?'':'s'}`)}
     if(dupes){score-=Math.min(20,dupes*4);reasons.push(`${dupes} duplicate matchup roster row${dupes===1?'':'s'}`)}
     if(badGroups){score-=Math.min(15,badGroups*3);reasons.push(`${badGroups} malformed matchup group${badGroups===1?'':'s'}`)}
   }
 }
 if(domain==='transactions'||domain==='trade'){
   if(!Array.isArray(s.transactionWeeks)){score-=55;reasons.push('transactions not captured')}
   else{let invalid=0;for(const w of s.transactionWeeks)for(const tr of (w.transactions||[]))for(const rid of (tr.roster_ids||[]))if(!rosterIds.has(Number(rid)))invalid++;if(invalid){score-=20;reasons.push(`${invalid} transaction roster reference${invalid===1?'':'s'} unmatched`)}}
 }
 if(domain==='playoffs'){
   const complete=['complete','post_season'].includes(String(s.league?.status||'').toLowerCase()), pt=Number(s.league?.settings?.playoff_teams||0), winners=Array.isArray(s.winners)?s.winners:[];
   if(complete&&pt>0&&!winners.length){score-=55;reasons.push('completed season missing winners bracket')}else{let invalid=0;for(const m of winners)for(const k of ['t1','t2','w','l'])if(m[k]!=null&&Number(m[k])>0&&!rosterIds.has(Number(m[k])))invalid++;if(invalid){score-=25;reasons.push(`${invalid} invalid playoff roster reference${invalid===1?'':'s'}`)}}
 }
 if(domain==='players'){

function luckSeasonRows(s){
 const rows=new Map();
 for(const r of s.rosters||[]){const i=identityForRoster(s,r.roster_id);rows.set(Number(r.roster_id),{rid:Number(r.roster_id),name:i.name,games:0,wins:0,losses:0,ties:0,pf:0,pa:0,apW:0,apL:0,apT:0,oppStrengthSum:0,oppGames:0})}
 const gamePairs=[];
 for(const w of s.matchupWeeks||[]){
   const validGroups=groupedMatchups(w).filter(([,g])=>g.length>=2&&historicalGameStatus(s,g[0],g[1]).valid);
   if(!validGroups.length)continue;
   const validRids=new Set(validGroups.flatMap(([,g])=>g.slice(0,2).map(m=>Number(m.roster_id))));
   const scored=(w.matchups||[]).filter(m=>validRids.has(Number(m?.roster_id))&&Number.isFinite(Number(m.points))).map(m=>({rid:Number(m.roster_id),pts:Number(m.points)}));
   for(const a of scored){const r=rows.get(a.rid);if(!r)continue;for(const b of scored){if(a.rid===b.rid)continue;if(a.pts>b.pts)r.apW++;else if(a.pts<b.pts)r.apL++;else r.apT++}}
   for(const [,g] of validGroups){const a=g[0],b=g[1],ra=rows.get(Number(a.roster_id)),rb=rows.get(Number(b.roster_id));if(!ra||!rb)continue;const ap=Number(a.points),bp=Number(b.points);ra.games++;rb.games++;ra.pf+=ap;rb.pf+=bp;ra.pa+=bp;rb.pa+=ap;if(ap>bp){ra.wins++;rb.losses++}else if(bp>ap){rb.wins++;ra.losses++}else{ra.ties++;rb.ties++}gamePairs.push([ra,rb])}
 }
 const arr=[...rows.values()].filter(r=>r.games>0);
 for(const r of arr){const den=r.apW+r.apL+r.apT;r.allPlayPct=den?(r.apW+.5*r.apT)/den:0;r.expectedWins=r.allPlayPct*r.games;r.actualEq=r.wins+.5*r.ties;r.scheduleLuck=r.actualEq-r.expectedWins;r.avgPA=r.pa/r.games}
 for(const [a,b] of gamePairs){a.oppStrengthSum+=b.allPlayPct;a.oppGames++;b.oppStrengthSum+=a.allPlayPct;b.oppGames++}
 const leagueAvgPA=arr.length?arr.reduce((n,r)=>n+r.avgPA,0)/arr.length:0;
 for(const r of arr){r.oppStrength=r.oppGames?r.oppStrengthSum/r.oppGames:0;r.paLuck=leagueAvgPA-r.avgPA}
 [...arr].sort((a,b)=>b.actualEq-a.actualEq||b.pf-a.pf).forEach((r,i)=>r.actualRank=i+1);
 [...arr].sort((a,b)=>b.allPlayPct-a.allPlayPct||b.pf-a.pf).forEach((r,i)=>r.expectedRank=i+1);
 for(const r of arr)r.rankDelta=r.expectedRank-r.actualRank;
 return arr.sort((a,b)=>b.actualEq-a.actualEq||b.pf-a.pf)
}

 for(const r of rows){const tags=[],evidence=[];const churnP=pctile('churn',r.churn),tradeP=pctile('trades',r.trades),startP=pctile('startPct',r.startPct),volP=pctile('volatility',r.volatility),luckP=pctile('avgLuck',r.avgLuck),repeatP=pctile('repeatPlayers',r.repeatPlayers);if(r.transactions>=5&&churnP>=.75){tags.push('Waiver Hawk');evidence.push(`${r.churn} adds+drops`)}if(r.trades>=2&&tradeP>=.75){tags.push('Trade Addict');evidence.push(`${r.trades} trades`)}if(r.rosterWeeks>=20&&startP>=.75){tags.push('Set-It-and-Forget-It');evidence.push(`${(r.startPct*100).toFixed(1)}% roster-week start rate`)}if(r.rosterWeeks>=20&&startP<=.25){tags.push('Bench Tinkerer');evidence.push(`${(r.startPct*100).toFixed(1)}% roster-week start rate`)}if(r.drafts>=10&&repeatP>=.75&&r.repeatPlayers>=2){tags.push('Draft Loyalist');evidence.push(`${r.repeatPlayers} repeat draft targets`)}if(r.scoreGames>=8&&volP>=.75){tags.push('Boom/Bust Merchant');evidence.push(`${r.volatility.toFixed(1)} weekly score SD`)}if(r.avgLuck>=.5&&luckP>=.75){tags.push('Horseshoe Collector');evidence.push(`${r.avgLuck>=0?'+':''}${r.avgLuck.toFixed(2)} avg schedule luck`)}if(r.avgLuck<=-.5&&luckP<=.25){tags.push('Cursed Scheduler');evidence.push(`${r.avgLuck.toFixed(2)} avg schedule luck`)}if(!tags.length)tags.push('Balanced Operator');r.archetypes=tags;r.evidence=evidence;}

function leagueEraData(){

       const m=managerStats.get(key);m.name=r.name;m.seasons++;m.w+=Number(r.wins)||0;m.l+=Number(r.losses)||0;m.t+=Number(r.ties)||0;m.pf+=Number(r.pf)||0;

     }

function historicalTimelineData(){
 const events=[];
 const add=(type,season,week,title,detail,extra={})=>events.push({type,season:String(season||''),week:Number(week)||0,title,detail,...extra});
 try{
   const h=historicalAlertData();
   const arr=Array.isArray(h)?h:(h?.events||[]);
   for(const e of arr)add(e.type||'alert',e.season,e.week,e.title,e.detail||'',{value:e.value||'',currentKey:e.currentKey||null});
 }catch(_){}
 // Championships.
 for(const s of state.seasons){
   const yr=String(s?.league?.season||''); if(!yr)continue;
   const ch=championshipSummary(s);
   if(ch?.winner&&ch?.runnerUp){
     const wi=identityForRoster(s,ch.winner),ri=identityForRoster(s,ch.runnerUp);
     add('championship',yr,ch.week||Number(s?.league?.settings?.last_scored_leg)||0,
       `${wi.name} won the UCL championship`,
       `${wi.name} defeated ${ri.name}${ch.winnerScore!=null&&ch.runnerScore!=null?` ${fmt(ch.winnerScore)}–${fmt(ch.runnerScore)}`:''}.`,
       {rosterA:ch.winner,rosterB:ch.runnerUp});
   }
 }
 // Manager arrivals/departures.
 const seasons=[...state.seasons].sort((a,b)=>Number(a?.league?.season||0)-Number(b?.league?.season||0));
 for(let i=1;i<seasons.length;i++){
   const prev=seasons[i-1],cur=seasons[i],yr=String(cur?.league?.season||'');
   const pm=new Map((standings(prev)||[]).map(z=>{const id=identityForRoster(prev,z.r.roster_id);return [String(id?.key||''),id?.name||'Unknown']}));
   const cm=new Map((standings(cur)||[]).map(z=>{const id=identityForRoster(cur,z.r.roster_id);return [String(id?.key||''),id?.name||'Unknown']}));
   const joined=[...cm].filter(([k])=>k&&!pm.has(k)).map(([,n])=>n);
   const left=[...pm].filter(([k])=>k&&!cm.has(k)).map(([,n])=>n);
   if(joined.length)add('manager',yr,0,'Managers joined the league',joined.join(', '));
   if(left.length)add('manager',yr,0,'Managers departed the league',left.join(', '));
 }
 // Major trades: 3+ moved players/picks, or any trade if very few exist.
 try{
   const all=allTransactions().filter(x=>String(x.tr?.type||'').toLowerCase()==='trade');
   for(const x of all){
     const tr=x.tr||{}, season=String(x.season||''), week=Number(x.week)||0;
     const playerCount=Object.keys(tr.adds||{}).length+Object.keys(tr.drops||{}).length;
     const pickCount=(tr.draft_picks||[]).length;
     const rosterIds=[...(tr.roster_ids||[])].map(Number).filter(Number.isFinite);
     if(playerCount+pickCount<3)continue;
     const s=state.seasons.find(ss=>String(ss?.league?.season||'')===season);
     const names=rosterIds.map(rid=>s?managerNameForRoster(s,rid):String(rid));
     add('trade',season,week,'Major trade recorded',
       `${names.join(' ↔ ')||'Multiple managers'} • ${playerCount} player movement${playerCount===1?'':'s'}${pickCount?` • ${pickCount} draft pick${pickCount===1?'':'s'}`:''}.`);
   }
 }catch(_){}
 // Draft oddities: earliest K/DEF and first overall.
 for(const s of state.seasons){
   const yr=String(s?.league?.season||''); if(!yr)continue;
   const picks=(s.draftPicks||[]).flatMap(b=>b.picks||[]).filter(p=>validPlayerPick(p)).sort((a,b)=>Number(a.pick_no)-Number(b.pick_no));
   const first=picks[0];
   if(first){
     const pl=playerLabel(first), mgr=managerNameForRoster(s,first.roster_id);
     add('draft',yr,0,'First overall draft pick',`${mgr} selected ${pl.name} at #1.`);
   }
   const odd=picks.find(p=>['K','DEF'].includes(String(p.metadata?.position||'').toUpperCase()));
   if(odd){
     const pl=playerLabel(odd),mgr=managerNameForRoster(s,odd.roster_id);
     add('draft',yr,0,`Earliest ${String(odd.metadata?.position||'').toUpperCase()} drafted`,`${mgr} selected ${pl.name} at #${odd.pick_no}.`);
   }
 }
 events.sort((a,b)=>Number(a.season)-Number(b.season)||a.week-b.week||a.type.localeCompare(b.type)||a.title.localeCompare(b.title));
 return events;
}

function historicalAlertData(){
 const seasons=[...state.seasons].sort((a,b)=>Number(a.league?.season||0)-Number(b.league?.season||0));
 const events=[];let high=-Infinity,big=-Infinity,close=Infinity,highLoss=-Infinity,lowWin=Infinity;
 const pairMeet=new Map(),lossRuns=new Map(),careerWins=new Map();
 const currentRecords={};
 const add=(type,season,week,title,detail,value,currentKey=null)=>events.push({type,season:String(season),week:Number(week)||0,title,detail,value,currentKey});
 for(const s of seasons){
  const weeks=[...(s.matchupWeeks||[])].sort((a,b)=>Number(a.week)-Number(b.week));
  for(const w of weeks){
   for(const [,arr] of groupedMatchups(w)){
    if(arr.length<2)continue;const [x,y]=arr;if(!historicalGameStatus(s,x,y).valid)continue;
    const xi=identityForRoster(s,x.roster_id),yi=identityForRoster(s,y.roster_id),xp=Number(x.points)||0,yp=Number(y.points)||0;
    const season=s.league?.season,week=w.week,margin=Math.abs(xp-yp),winner=xp>yp?xi:yp>xp?yi:null,loser=xp>yp?yi:yp>xp?xi:null,winScore=Math.max(xp,yp),loseScore=Math.min(xp,yp);
    for(const [id,pts,opp] of [[xi,xp,yi],[yi,yp,xi]])if(pts>high){high=pts;currentRecords.high={season:String(season),week:Number(week),name:id.name,value:pts};add('record',season,week,'New all-time scoring record',`${id.name} scored ${fmt(pts)} against ${opp.name}.`,fmt(pts),'high')}
    if(margin>big){big=margin;currentRecords.big={season:String(season),week:Number(week),winner:winner?.name||'—',loser:loser?.name||'—',value:margin};add('record',season,week,'New biggest blowout',`${winner?.name||'—'} beat ${loser?.name||'—'} by ${fmt(margin)}.`,`${fmt(margin)} pts`,'big')}
    if(margin>0&&margin<close){close=margin;currentRecords.close={season:String(season),week:Number(week),a:xi.name,b:yi.name,value:margin};add('record',season,week,'New closest-game record',`${xi.name} and ${yi.name} finished ${fmt(margin)} points apart.`,`${fmt(margin)} pts`,'close')}
    if(loser&&loseScore>highLoss){highLoss=loseScore;currentRecords.highLoss={season:String(season),week:Number(week),name:loser.name,value:loseScore};add('record',season,week,'New highest score in a loss',`${loser.name} scored ${fmt(loseScore)} and still lost to ${winner.name}.`,fmt(loseScore),'highLoss')}
    if(winner&&winScore<lowWin){lowWin=winScore;currentRecords.lowWin={season:String(season),week:Number(week),name:winner.name,value:winScore};add('record',season,week,'New lowest winning score',`${winner.name} won with only ${fmt(winScore)} points.`,fmt(winScore),'lowWin')}
    const pair=[String(xi.key),String(yi.key)].sort(),pk=pair.join('|'),n=(pairMeet.get(pk)||0)+1;pairMeet.set(pk,n);if([5,10,15,20,25].includes(n))add('rivalry',season,week,`${n}th rivalry meeting`,`${xi.name} vs ${yi.name} reached ${n} recorded meetings.`,`${n} meetings`);
    if(winner&&loser){
      const wk=String(winner.key),lk=String(loser.key),lossKey=`${lk}|${wk}`,winKey=`${wk}|${lk}`;
      const ended=lossRuns.get(winKey)||0;if(ended>=3)add('drought',season,week,'Opponent drought ended',`${winner.name} finally beat ${loser.name} after ${ended} consecutive losses to them.`,`${ended}-game drought`);
      lossRuns.set(winKey,0);lossRuns.set(lossKey,(lossRuns.get(lossKey)||0)+1);
      const cw=(careerWins.get(wk)||0)+1;careerWins.set(wk,cw);if([10,25,50,75,100].includes(cw))add('career',season,week,`${cw}th career win`,`${winner.name} reached ${cw} recorded regular-season wins.`,`${cw} wins`);
    }
   }
  }
 }
 // Legacy Score leader changes, recalculated cumulatively at each completed season boundary.
 const cumulative=new Map();let prevLeader=null;
 for(const s of seasons){
  for(const r of s.rosters||[]){const id=identityForRoster(s,r.roster_id),k=String(id.key),st=r.settings||{};if(!cumulative.has(k))cumulative.set(k,{key:k,name:id.name,seasons:0,w:0,l:0,t:0,apps:0,pow:0,titles:0,ru:0});const z=cumulative.get(k);z.name=id.name;z.seasons++;z.w+=Number(st.wins||0);z.l+=Number(st.losses||0);z.t+=Number(st.ties||0)}
  const ids=playoffRosterIds(s),champ=championshipSummary(s);for(const rid of ids){const id=identityForRoster(s,rid),z=cumulative.get(String(id.key));if(z)z.apps++}if(champ){let id=identityForRoster(s,champ.winner),z=cumulative.get(String(id.key));if(z)z.titles++;id=identityForRoster(s,champ.runnerUp);z=cumulative.get(String(id.key));if(z)z.ru++}

function bindHistoricalGameLinks(root=document){
  root.querySelectorAll('[data-game-season][data-game-week]').forEach(el=>{ if(el.dataset.gameBound) return; el.dataset.gameBound='1'; el.classList.add('game-link'); el.addEventListener('click',()=>openHistoricalGame(el.dataset.gameSeason,el.dataset.gameWeek,el.dataset.gameRosterA||null,el.dataset.gameRosterB||null,el.dataset.gameMatchupId||null)); });
}
function __uclAutoLinkGameText(root=document){
  bindHistoricalGameLinks(root);
  const selectors='.record-card,.absurd-row,.mini,.matchup,.legacy-mini,.legacy-h2h-card,.game-context-card,.timeline-event,.event-card,.alert-card,.story-card,.search-result,tr[data-game-ref],.card [data-specific-game]';
  const nodes=root.querySelectorAll?root.querySelectorAll(selectors):[];
  for(const el of nodes){
    if(el.dataset?.gameBound||el.dataset?.gameScan==='1') continue;
    el.dataset.gameScan='1';
    const txt=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
    const sm=txt.match(/\b(20\d{2})\b/), wm=txt.match(/\b(?:W|Week\s*)(\d{1,2})\b/i);
    if(!sm||!wm) continue;
    const season=(state?.seasons||[]).find(s=>String(s.league?.season||s.season)===sm[1]); if(!season) continue;
    const names=[];
    for(const id of (season.identities||[])){
      const n=(id.username||id.display_name||id.team_name||'').trim(); if(n) names.push({n,r:Number(id.roster_id??id.season_roster_id)});
    }
    for(const r of (season.rosters||[])){
      const i=__uclIdentityForRoster(season,r.roster_id); if(i.username) names.push({n:i.username,r:Number(r.roster_id)});
    }
    names.sort((a,b)=>b.n.length-a.n.length);
    const low=txt.toLowerCase(), found=[];
    for(const x of names){if(low.includes(x.n.toLowerCase())&&!found.some(f=>f.r===x.r))found.push(x); if(found.length>=2)break;}
    if(found.length>=2){
      el.dataset.gameSeason=sm[1]; el.dataset.gameWeek=wm[1]; el.dataset.gameRosterA=String(found[0].r); el.dataset.gameRosterB=String(found[1].r);
      el.removeAttribute('data-game-scan'); bindHistoricalGameLinks(root);
    }
  }
}

function buildPlayerImpactRows(){
  const rows=[];
  const seasons=(state&&state.seasons)||[];
  for(const season of seasons){
    const yr=String(season.league?.season||season.season||'');
    const idMap={};
    (season.identities||[]).forEach(i=>{idMap[i.roster_id||i.season_roster_id]=i.display_name||i.username||i.team_name||String(i.owner_id||i.user_id||'Unknown')});
    const agg={};
    for(const week of (season.matchupWeeks||[])){
      const w=week.week||week.leg||week.week_no||'';
      const arr=week.matchups||week.rows||week.data||week||[];
      const items=Array.isArray(arr)?arr:[];
      for(const m of items){
        if(!m||!m.roster_id) continue;
        const manager=idMap[m.roster_id]||String(m.roster_id);
        const players=Array.isArray(m.players)?m.players:[];
        const starters=new Set(Array.isArray(m.starters)?m.starters:[]);
        const ppts=m.players_points||m.player_points||{};
        for(const pid of players){
          const name=__uclPlayerNameFromId(season,pid) || (typeof pid==='string'&&!/^\d+$/.test(pid)?pid:'');
          if(!name) continue;
          const pts=Number((ppts&&ppts[pid])||0);
          const key=yr+'|'+manager+'|'+pid;
          if(!agg[key]) agg[key]={season:yr,manager,player:name,playerId:pid,points:0,weeks:0,starts:0,bench:0,bestWeek:-Infinity,bestWeekNo:null};
          const r=agg[key]; r.points+=pts; r.weeks++; if(starters.has(pid)) r.starts++; else r.bench++; if(pts>r.bestWeek){r.bestWeek=pts;r.bestWeekNo=w;}
        }
      }
    }
    rows.push(...Object.values(agg));
  }
  return rows;
}

// Performance cache
const __uclPerf={signature:'',cache:new Map(),hits:0,misses:0,lastReset:Date.now()};
function __uclArchiveSignature(){
  const seasons=Array.isArray(state.seasons)?state.seasons:[];
  return seasons.map(s=>[
    s?.league?.league_id||s?.id||'',
    s?.league?.season||'',
    s?.fetchedAt||0,
    (s?.matchupWeeks||[]).length,
    (s?.transactionWeeks||[]).length,
    (s?.draftPicks||[]).length,
    (s?.rosters||[]).length
  ].join(':')).join('|');
}
function __uclEnsurePerfCache(){
  const sig=__uclArchiveSignature();
  if(sig!==__uclPerf.signature){
    __uclPerf.signature=sig;
    __uclPerf.cache.clear();
    __uclPerf.lastReset=Date.now();
  }
}
function __uclMemo(name,fn){
  return function(...args){
    __uclEnsurePerfCache();
    const simple=args.every(a=>a==null||['string','number','boolean'].includes(typeof a));
    if(!simple)return fn.apply(this,args);
    const key=name+'|'+args.map(a=>String(a)).join('|');
    if(__uclPerf.cache.has(key)){__uclPerf.hits++;return __uclPerf.cache.get(key)}
    __uclPerf.misses++;
    const value=fn.apply(this,args);
    __uclPerf.cache.set(key,value);
    return value;
  };
}
function __uclMemoSeason(name,fn){
  const wm=new WeakMap();
  return function(s,...args){
    __uclEnsurePerfCache();
    if(!s||typeof s!=='object')return fn.call(this,s,...args);
    let byArgs=wm.get(s);if(!byArgs){byArgs=new Map();wm.set(s,byArgs)}
    const key=args.map(a=>String(a)).join('|');
    if(byArgs.has(key)){__uclPerf.hits++;return byArgs.get(key)}
    __uclPerf.misses++;
    const value=fn.call(this,s,...args);byArgs.set(key,value);return value;
  };
}

function currentUCLFantasyWeek(date=new Date()){

 return Math.max(1,Math.min(18,Math.floor((date-start)/604800000)+1));
}
function historicalCalendarTransactions(){

 for(const x of allTransactions()){
   const ts=Number(x.tr?.created||0);if(!ts)continue;

   rows.push({...x,date:dt});
 }
 return rows;
}

function seasonPlayerPerformance(s){
  const totals=new Map(), starts=new Map(), weeksSeen=new Set();
  for(const w of s.matchupWeeks||[]){
    let weekHas=false;
    for(const m of w.matchups||[]){
      const pp=m.players_points||m.playersPoints||{};
      for(const [pid,val] of Object.entries(pp||{})){
        const n=Number(val); if(!Number.isFinite(n))continue;
        totals.set(String(pid),(totals.get(String(pid))||0)+n); weekHas=true;
      }
      for(const pid of m.starters||[]){if(pid!=null)starts.set(String(pid),(starts.get(String(pid))||0)+1)}
    }
    if(weekHas)weeksSeen.add(Number(w.week));
  }
  return {totals,starts,weeks:weeksSeen.size};
}
function historicalDraftValue(){
  const rows=[],seasonMeta=[];
  for(const s of state.seasons){
    const perf=seasonPlayerPerformance(s), picks=[];
    for(const block of s.draftPicks||[])for(const p of block.picks||[]){
      const pl=playerLabel(p),mgr=draftManagerKey(s,p.roster_id),pid=String(p.player_id||''); if(!pl.resolved)continue;
      if(!pid)continue;
      picks.push({season:String(s.league.season),pick:p,player:pl,manager:mgr,pid,points:perf.totals.has(pid)?perf.totals.get(pid):null,starts:perf.starts.get(pid)||0});
    }
    const scored=picks.filter(x=>x.points!=null).sort((a,b)=>b.points-a.points||Number(a.pick.pick_no)-Number(b.pick.pick_no));
    scored.forEach((x,i)=>x.performanceRank=i+1);
    const rankByPid=new Map(scored.map(x=>[`${x.pid}|${x.pick.pick_no}`,x.performanceRank]));
    for(const x of picks){
      const pr=rankByPid.get(`${x.pid}|${x.pick.pick_no}`); if(!pr)continue;
      x.performanceRank=pr; x.draftRank=Number(x.pick.pick_no)||0; x.valueDelta=x.draftRank-pr;
      rows.push(x);
    }
    seasonMeta.push({season:String(s.league.season),weeks:perf.weeks,picks:picks.length,scored:scored.length});
  }
  return {rows,seasonMeta};
}

function historicalTieCorroborated(s,a,b){
 const ap=Number(a?.points),bp=Number(b?.points); if(!Number.isFinite(ap)||!Number.isFinite(bp)||ap!==bp||ap===0)return false;
 const rm=new Map((s.rosters||[]).map(r=>[Number(r.roster_id),r]));
 return Number(rm.get(Number(a.roster_id))?.settings?.ties||0)>0 && Number(rm.get(Number(b.roster_id))?.settings?.ties||0)>0;
}
function historicalGameStatus(s,a,b){
 const ap=Number(a?.points),bp=Number(b?.points);
 if(maintenanceGameIgnored(s,a,b))return {valid:false,reason:'maintenance-ignore'};
 if(!Number.isFinite(ap)||!Number.isFinite(bp))return {valid:false,reason:'missing-score'};
 if(ap===0&&bp===0)return {valid:false,reason:'all-zero'};
 if(ap===bp&&!historicalTieCorroborated(s,a,b))return {valid:false,reason:'uncorroborated-tie'};
 return {valid:true,tie:ap===bp};
}

function postTradePlayerStats(s,pid,rosterId,fromWeek){
 let points=0,weeks=0,starts=0;
 for(const w of (s.matchupWeeks||[])){
  if(Number(w.week)<Number(fromWeek))continue;
  const m=(w.matchups||[]).find(x=>Number(x.roster_id)===Number(rosterId));
  if(!m)continue;
  const players=(m.players||[]).map(String);
  if(!players.includes(String(pid)))continue;
  weeks++;
  const pp=m.players_points||m.playersPoints||{};
  const val=Number(pp?.[pid]); if(Number.isFinite(val))points+=val;
  if((m.starters||[]).map(String).includes(String(pid)))starts++;
 }
 return {points,weeks,starts};
}
function tradeEvaluationData(){
 const trades=allTransactions().filter(x=>String(x.tr.type||'').toLowerCase()==='trade');
 return trades.map(x=>{
  const {s,tr}=x,rids=[...(tr.roster_ids||[])].map(Number),sum=transactionSummary(x);
  const sides=rids.map(rid=>{
   const id=transactionRosterIdentity(s,rid);
   const received=Object.entries(tr.adds||{}).filter(([,to])=>Number(to)===rid).map(([pid])=>{const stat=postTradePlayerStats(s,pid,rid,x.week);return {pid,name:transactionPlayerName(pid),...stat}}).filter(x=>x.name);
   const sent=Object.entries(tr.drops||{}).filter(([,from])=>Number(from)===rid).map(([pid])=>({pid,name:transactionPlayerName(pid)})).filter(x=>x.name);
   const recvPicks=(tr.draft_picks||[]).filter(p=>Number(p.owner_id)===rid);
   const sentPicks=(tr.draft_picks||[]).filter(p=>Number(p.previous_owner_id)===rid);
   const points=received.reduce((a,b)=>a+b.points,0),weeks=received.reduce((a,b)=>a+b.weeks,0),starts=received.reduce((a,b)=>a+b.starts,0);
   return {rid,...id,received,sent,recvPicks,sentPicks,points,weeks,starts};
  });
  const hasPicks=sides.some(z=>z.recvPicks.length||z.sentPicks.length), ranked=[...sides].sort((a,b)=>b.points-a.points);
  let verdict='Not enough captured player production to compare yet.',status='open';
  if(ranked.length>=2 && ranked[0].points>0){
    const diff=ranked[0].points-ranked[1].points;
    verdict=`Post-trade production leader: ${ranked[0].name} by ${fmt(diff)} captured points.`;
    status=hasPicks?'open':'closed';
  }
  if(hasPicks)verdict+=' Draft-pick value remains unresolved, so this is not a final trade winner.';
  return {...x,sum,sides,hasPicks,verdict,status};
 });
}

function playoffPathData(){
 const byManager=new Map(), elimPairs=new Map(), seasons=[];
 const ordered=[...state.seasons].sort((a,b)=>Number(a?.league?.season||0)-Number(b?.league?.season||0));
 for(const s of ordered){
   const yr=String(s?.league?.season||''), ids=playoffRosterIds(s), games=postseasonGames(s).sort((a,b)=>a.week-b.week), champ=championshipSummary(s);
   if(!ids.size && !games.length) continue;
   const seasonEntry={season:yr,managerPaths:[]};
   for(const rid of ids){
     const ident=identityForRoster(s,rid), key=String(ident.key||rid), name=ident.name||managerNameForRoster(s,rid);
     const seed=seedFor(s,rid), mine=[];
     for(const g of games){
       const xrid=Number(g.x?.roster_id), yrid=Number(g.y?.roster_id);
       if(xrid!==Number(rid)&&yrid!==Number(rid)) continue;
       const me=xrid===Number(rid)?g.x:g.y, opp=xrid===Number(rid)?g.y:g.x;
       const mp=__uclSafeNum(me?.points), op=__uclSafeNum(opp?.points);
       if(mp==null||op==null) continue;
       const oi=identityForRoster(s,opp.roster_id), won=mp>op;
       const isFinal=champ && ((Number(champ.winner)===Number(rid)&&Number(champ.runnerUp)===Number(opp.roster_id))||(Number(champ.runnerUp)===Number(rid)&&Number(champ.winner)===Number(opp.roster_id)));
       mine.push({week:Number(g.week),round:Number(g.round)||0,opponent:oi.name,opponentKey:String(oi.key||opp.roster_id),opponentRoster:Number(opp.roster_id),myRoster:Number(rid),myPoints:mp,oppPoints:op,won,isFinal});
     }
     mine.sort((a,b)=>a.week-b.week);
     const title=champ?.winner===Number(rid), runner=champ?.runnerUp===Number(rid);
     const losses=mine.filter(g=>!g.won), lastLoss=losses.at(-1)||null;
     const status=title?'Champion':runner?'Runner-up':lastLoss?'Eliminated':'Playoff appearance';
     const path={season:yr,key,name,rosterId:Number(rid),seed,games:mine,title,runner,status,eliminator:lastLoss?.opponent||null,eliminatorKey:lastLoss?.opponentKey||null};
     seasonEntry.managerPaths.push(path);
     if(!byManager.has(key))byManager.set(key,{key,name,apps:0,titles:0,runnerUps:0,w:0,l:0,paths:[],eliminators:new Map(),opponents:new Map()});
     const m=byManager.get(key);m.name=name;m.apps++;m.paths.push(path);if(title)m.titles++;if(runner)m.runnerUps++;
     for(const game of mine){
       if(game.won)m.w++;else m.l++;
       if(!m.opponents.has(game.opponentKey))m.opponents.set(game.opponentKey,{key:game.opponentKey,name:game.opponent,games:0,w:0,l:0});
       const o=m.opponents.get(game.opponentKey);o.games++;if(game.won)o.w++;else o.l++;
     }
     if(lastLoss){
       if(!m.eliminators.has(lastLoss.opponentKey))m.eliminators.set(lastLoss.opponentKey,{key:lastLoss.opponentKey,name:lastLoss.opponent,count:0,seasons:[]});
       const e=m.eliminators.get(lastLoss.opponentKey);e.count++;e.seasons.push(yr);
       const pairKey=`${key}|${lastLoss.opponentKey}`;
       if(!elimPairs.has(pairKey))elimPairs.set(pairKey,{victimKey:key,victim:name,elimKey:lastLoss.opponentKey,eliminator:lastLoss.opponent,count:0,seasons:[]});
       const p=elimPairs.get(pairKey);p.count++;p.seasons.push(yr);
     }
   }
   if(seasonEntry.managerPaths.length)seasons.push(seasonEntry);
 }
 const managers=[...byManager.values()].map(m=>({
   ...m,
   eliminators:[...m.eliminators.values()].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name)),
   opponents:[...m.opponents.values()].sort((a,b)=>b.games-a.games||b.w-a.w)
 })).sort((a,b)=>b.titles-a.titles||b.w-a.w||b.apps-a.apps||a.name.localeCompare(b.name));
 const repeatEliminators=[...elimPairs.values()].filter(x=>x.count>=2).sort((a,b)=>b.count-a.count||a.victim.localeCompare(b.victim));
 return {managers,seasons,repeatEliminators};
}

function hallOfFameRows(){
 const careers=careerRows(), post=new Map(postseasonManagerStats().map(x=>[x.key,x]));
 return careers.map(c=>{
   const p=post.get(c.key)||{apps:0,w:0,l:0,t:0,titles:0,runnerUps:0};
   const games=c.w+c.l+c.t, wp=games?(c.w+c.t*.5)/games:0;
   const tenurePts=c.seasons*2;
   const winsPts=c.w;
   const playoffAppPts=p.apps*3;
   const playoffWinPts=p.w*4;
   const runnerUpPts=p.runnerUps*8;
   const titlePts=p.titles*20;
   const sample=Math.min(1,games/28);
   const winPctPts=Math.min(15,Math.max(0,(wp-.5)*50))*sample;
   const score=tenurePts+winsPts+playoffAppPts+playoffWinPts+runnerUpPts+titlePts+winPctPts;
   return {...c,post:p,games,wp,score,components:{tenurePts,winsPts,playoffAppPts,playoffWinPts,runnerUpPts,titlePts,winPctPts}};
 }).sort((a,b)=>b.score-a.score||b.post.titles-a.post.titles||b.post.w-a.post.w||b.w-a.w);
}
function hofTier(score,max){const ratio=max?score/max:0;if(ratio>=.80)return ['Legend','legend'];if(ratio>=.58)return ['Great','great'];if(ratio>=.38)return ['Notable','notable'];return ['League Member','member']}

small>Career totals from saved seasons</small></div><div class="scroll"><table class="stack-table"><thead><tr><th>Manager</th><th>Seasons</th><th>W-L-T</th><th>Pct</th><th>PF</th><th>PA</th><th>Titles*</th></tr></thead><tbody>${rows.map(x=>`<tr><td data-label="Manager"><b>${esc(x.name)}</b><div class="tiny muted">${esc(x.username?('@'+x.username):'')}${x.displayName&&x.displayName!==x.username?` • ${esc(x.displayName)}`:''}</div></td><td data-label="Seasons">${x.seasons}</td><td data-label="Record">${x.w}-${x.l}-${x.t}</td><td data-label="Win %">${pct(x.w,x.l,x.t)}</td><td data-label="Points For">${fmt(x.pf)}</td><td data-label="Points Against">${fmt(x.pa)}</td><td data-label="Titles" class="gold">${x.titles}</td></tr>`).join('')}</tbody></table></div><div class="tiny muted" style="margin-top:8px">* Titles inferred from available winners-bracket placement data; league configurations can affect bracket semantics.</div></section></div>`}
function identityForRoster(s,rosterId){const {ownerByRoster,rm}=mapping(s),u=ownerByRoster.get(rosterId),r=rm.get(rosterId);return {key:u?.user_id||`roster:${s.league.season}:${rosterId}`,name:managerName(u,r),teamName:teamName(u,r),username:u?.username||''}}
function headToHeadRows(){const pairs=new Map();for(const s of (Array.isArray(state.seasons)?state.seasons:[])){if(!s)continue;for(const w of (Array.isArray(s.matchupWeeks)?s.matchupWeeks:[])){for(const [,a] of groupedMatchups(w)){if(!Array.isArray(a)||a.length<2)continue;const x=a[0],y=a[1];if(!x||!y)continue;const xp=Number(x?.points),yp=Number(y?.points);if(!Number.isFinite(xp)||!Number.isFinite(yp)||!historicalGameStatus(s,x,y).valid)continue;const xi=identityForRoster(s,x?.roster_id)||{},yi=identityForRoster(s,y?.roster_id)||{};const xik=String(xi.key??xi.user_id??xi.roster_id??''),yik=String(yi.key??yi.user_id??yi.roster_id??'');if(!xik||!yik||xik===yik)continue;const keys=[xik,yik].sort(),pk=keys.join('|');if(!pairs.has(pk))pairs.set(pk,{a:keys[0],b:keys[1],names:{[xik]:String(xi.name||'Unknown'),[yik]:String(yi.name||'Unknown')},wins:{[keys[0]]:0,[keys[1]]:0},ties:0,pf:{[keys[0]]:0,[keys[1]]:0},games:0,last:null});const p=pairs.get(pk);p.names[xik]=String(xi.name||'Unknown');p.names[yik]=String(yi.name||'Unknown');p.games++;p.pf[xik]+=xp;p.pf[yik]+=yp;if(xp>yp)p.wins[xik]++;else if(yp>xp)p.wins[yik]++;else p.ties++;p.last={season:s.league?.season,week:w?.week,winner:xp===yp?'Tie':(xp>yp?p.names[xik]:p.names[yik])}}}}return [...pairs.values()].sort((a,b)=>b.games-a.games)}
function viewHeadToHead(){const rows=headToHeadRows();if(!rows.length)return '<div class="card empty">No head-to-head matchup history loaded.</div>';return `<div class="card"><div class="section-title"><h2>All-Time Head-to-Head</h2><small>Calculated entirely from saved matchup history</small></div><div class="h2h-grid">${rows.map(p=>`<article class="h2h-card"><div class="h2h-title">${esc(p.names[p.a])} vs ${esc(p.names[p.b])}</div><div class="h2h-line"><span>${esc(p.names[p.a])}</span><b>${p.wins[p.a]} wins</b></div><div class="h2h-line"><span>${esc(p.names[p.b])}</span><b>${p.wins[p.b]} wins</b></div><div class="h2h-line"><span>Ties / Meetings</span><b>${p.ties} / ${p.games}</b></div><div class="h2h-line"><span>Points</span><b>${fmt(p.pf[p.a])} – ${fmt(p.pf[p.b])}</b></div><div class="tiny muted" style="margin-top:7px">Latest: ${p.last?.season||'—'} W${p.last?.week||'—'} • ${esc(p.last?.winner||'—')}</div></article>`).join('')}</div></div>`}

function rivalryRows(){
 const pairs=new Map();
 for(const s of state.seasons){
  const champ=championshipSummary(s);
  const championshipRosters=champ?new Set([Number(champ.winner),Number(champ.runnerUp)]):null;
  const playoffGameKeys=postseasonGameKeySet(s);
  for(const w of s.matchupWeeks||[]){
   for(const [,a] of groupedMatchups(w)){
    if(a.length<2)continue;
    const [x,y]=a;if(!historicalGameStatus(s,x,y).valid)continue;const xi=identityForRoster(s,x.roster_id),yi=identityForRoster(s,y.roster_id);
    if(xi.key===yi.key)continue;
    const keys=[xi.key,yi.key].sort(),pk=keys.join('|');
    if(!pairs.has(pk))pairs.set(pk,{a:keys[0],b:keys[1],names:{},wins:{[keys[0]]:0,[keys[1]]:0},ties:0,pf:{[keys[0]]:0,[keys[1]]:0},games:0,playoffGames:0,playoffWins:{[keys[0]]:0,[keys[1]]:0},titleGames:0,biggest:null,closest:null,last:null,streakKey:null,streakN:0,bestStreak:{key:null,n:0}});
    const p=pairs.get(pk);p.names[xi.key]=xi.name;p.names[yi.key]=yi.name;p.games++;p.pf[xi.key]+=Number(x.points||0);p.pf[yi.key]+=Number(y.points||0);
    let wk=null;if(+x.points>+y.points){p.wins[xi.key]++;wk=xi.key}else if(+y.points>+x.points){p.wins[yi.key]++;wk=yi.key}else p.ties++;
    const margin=Math.abs((+x.points||0)-(+y.points||0));const game={season:s.league.season,week:w.week,x:xi,y:yi,xp:+x.points||0,yp:+y.points||0,margin,winnerKey:wk};
    if(!p.biggest||margin>p.biggest.margin)p.biggest=game;if(!p.closest||margin<p.closest.margin)p.closest=game;
    const isPO=playoffGameKeys.has(postseasonGameKey(s.league.season,w.week,x.roster_id,y.roster_id));
    const gameRosters=new Set([Number(x.roster_id),Number(y.roster_id)]);
    const isTitle=!!(championshipRosters&&championshipRosters.size===2&&gameRosters.size===2&&[...championshipRosters].every(r=>gameRosters.has(r)));
    if(isPO){p.playoffGames++;if(wk)p.playoffWins[wk]++;if(isTitle)p.titleGames++}
    if(wk){if(p.streakKey===wk)p.streakN++;else{p.streakKey=wk;p.streakN=1}if(p.streakN>p.bestStreak.n)p.bestStreak={key:wk,n:p.streakN}}else{p.streakKey=null;p.streakN=0}
    p.last={...game,isPO,isTitle};
   }
  }
 }

      runner:li.username,runnerKey:li.userId||li.username,winnerId:Number(ch.winner),runnerId:Number(ch.runnerUp),

  const starters=[...starterMap.values()].map(x=>({...x,managers:[...x.managers],seasons:[...x.seasons]})).sort((a,b)=>b.starts-a.starts||b.titles-a.titles);
  const byMargin=[...finals].sort((a,b)=>a.margin-b.margin);

function dynastyHistoryData(){
 const seasons=[...state.seasons].filter(s=>String(s?.league?.status||'').toLowerCase()!=='drafting').sort((a,b)=>Number(a.league.season)-Number(b.league.season));

 const ensure=(key,name)=>{key=String(key||'');if(!mgr.has(key))mgr.set(key,{key,name:name||key,active:[],playoffs:[],titles:[],finals:[],semifinalLosses:0,elim:new Map()});const z=mgr.get(key);if(name)z.name=name;return z};

  if(champ){const wi=identityForRoster(s,champ.winner),ri=identityForRoster(s,champ.runnerUp);if(wi?.key){const z=ensure(wi.key,wi.name);z.titles.push(y);z.finals.push(y)}if(ri?.key)ensure(ri.key,ri.name).finals.push(y);timeline.push({year:y,champ:wi?.name||champ.winnerName,runner:ri?.name||champ.runnerName,score:champ.winnerScore==null?'':`${fmt(champ.winnerScore)}–${fmt(champ.runnerScore)}`,week:champ.week})}
  const ps=postseasonGames(s);
  const finalPair=champ?new Set([Number(champ.winner),Number(champ.runnerUp)]):new Set();
  for(const g of ps){const xp=Number(g?.x?.points),yp=Number(g?.y?.points);if(!Number.isFinite(xp)||!Number.isFinite(yp)||xp===yp)continue;const winner=xp>yp?g.x:g.y,loser=xp>yp?g.y:g.x;const wi=identityForRoster(s,winner.roster_id),li=identityForRoster(s,loser.roster_id);if(!wi?.key||!li?.key)continue;const lz=ensure(li.key,li.name),k=String(wi.key);lz.elim.set(k,{name:wi.name,count:(lz.elim.get(k)?.count||0)+1});if(champ && !finalPair.has(Number(loser.roster_id)) && !g.isFinal)lz.semifinalLosses++}
 }
 const consecutive=(arr)=>{const a=[...new Set(arr)].sort((x,y)=>x-y);let best=0,cur=0,prev=null,start=null,bestStart=null,bestEnd=null;for(const y of a){if(prev!=null&&y===prev+1){cur++}else{cur=1;start=y}if(cur>best){best=cur;bestStart=start;bestEnd=y}prev=y}return {best,start:bestStart,end:bestEnd}}
 const drought=(active,hits)=>{const hs=new Set(hits),a=[...new Set(active)].sort((x,y)=>x-y);let best=0,cur=0,bestStart=null,bestEnd=null,start=null;for(const y of a){if(hs.has(y)){cur=0;start=null}else{if(!cur)start=y;cur++;if(cur>best){best=cur;bestStart=start;bestEnd=y}}}let current=0;for(let i=a.length-1;i>=0;i--){if(hs.has(a[i]))break;current++}return {best,current,start:bestStart,end:bestEnd}}
 const rows=[...mgr.values()].map(z=>{const titleRun=consecutive(z.titles),finalRun=consecutive(z.finals),titleD=drought(z.active,z.titles),playD=drought(z.active,z.playoffs),elim=[...z.elim.values()].sort((a,b)=>b.count-a.count)[0]||null;return {...z,titleRun,finalRun,titleD,playD,elim}});
 return {seasons,rows,timeline};
}

function seasonStorylineData(s){
 const a=seasonAwardData(s), st=standings(s), champ=championshipSummary(s), tx=[];
 for(const w of (s.transactionWeeks||[]))for(const tr of (w.transactions||[]))tx.push({week:Number(w.week)||0,tr});
 const trades=tx.filter(x=>String(x.tr.type||'').toLowerCase()==='trade');
 const waivers=tx.filter(x=>String(x.tr.type||'').toLowerCase()==='waiver');
 const freeAgents=tx.filter(x=>String(x.tr.type||'').toLowerCase()==='free_agent');
 const biggestBid=tx.map(x=>({week:x.week,bid:Number(x.tr.settings?.waiver_bid??x.tr.settings?.waiver_amount??0)||0,tr:x.tr})).sort((x,y)=>y.bid-x.bid)[0]||null;
 const dv=historicalDraftValue().rows.filter(x=>String(x.season)===String(s.league.season));
 const bestPick=dv.length?[...dv].sort((x,y)=>y.valueDelta-x.valueDelta||y.points-x.points)[0]:null;
 const worstPick=dv.length?[...dv].sort((x,y)=>x.valueDelta-y.valueDelta||x.points-y.points)[0]:null;
 let highGame=null, closeGame=null, highLoss=null;
 for(const w of s.matchupWeeks||[])for(const [,g] of groupedMatchups(w)){
   if(g.length<2)continue;
   const [x,y]=g, xp=Number(x.points)||0, yp=Number(y.points)||0;
   const xi=identityForRoster(s,x.roster_id), yi=identityForRoster(s,y.roster_id);
   for(const z of [{name:xi.name,opp:yi.name,score:xp,oppScore:yp},{name:yi.name,opp:xi.name,score:yp,oppScore:xp}]){
     if(!highGame||z.score>highGame.score)highGame={...z,week:w.week};
     if(z.score<z.oppScore&&(!highLoss||z.score>highLoss.score))highLoss={...z,week:w.week};
   }
   const margin=Math.abs(xp-yp);
   if(!closeGame||margin<closeGame.margin)closeGame={margin,week:w.week,a:xi.name,b:yi.name,aScore:xp,bScore:yp};
 }
 const winner=st[0]||null, last=st[st.length-1]||null;
 return {a,st,champ,tx,trades,waivers,freeAgents,biggestBid,bestPick,worstPick,highGame,closeGame,highLoss,winner,last};
}
function storylineParagraphs(s){
 const d=seasonStorylineData(s), y=String(s.league.season), p=[];
 if(d.champ){
   let score='';
   if(d.champ.winnerScore!=null&&d.champ.runnerScore!=null)score=` ${fmt(d.champ.winnerScore)}–${fmt(d.champ.runnerScore)}`;
   p.push(`<b>${esc(d.champ.winnerName)}</b> finished ${y} as UCL champion, defeating <b>${esc(d.champ.runnerName)}</b>${score}${d.champ.week?` in Week ${esc(d.champ.week)}`:''}.`);
 }else if(d.winner){
   p.push(`<b>${esc(managerName(d.winner.u,d.winner.r))}</b> led the recorded regular-season standings at ${d.winner.r.settings?.wins||0}-${d.winner.r.settings?.losses||0}-${d.winner.r.settings?.ties||0}. The saved bracket does not identify a championship result.`);
 }
 if(d.a.highPF)p.push(`<b>${esc(d.a.highPF.name)}</b> won the scoring crown with ${fmt(d.a.highPF.value)} points.`);
 if(d.a.biggest)p.push(`The season's biggest recorded beatdown belonged to <b>${esc(d.a.biggest.name)}</b>, a ${fmt(d.a.biggest.margin)}-point win in Week ${esc(d.a.biggest.week)}.`);
 if(d.highGame)p.push(`The highest single-team score in the cached matchup archive was <b>${fmt(d.highGame.score)}</b> by ${esc(d.highGame.name)} against ${esc(d.highGame.opp)} in Week ${esc(d.highGame.week)}.`);
 if(d.highLoss)p.push(`The season's toughest high-scoring loss was ${esc(d.highLoss.name)} putting up <b>${fmt(d.highLoss.score)}</b> and still losing to ${esc(d.highLoss.opp)}.`);
 if(d.closeGame)p.push(`The closest recorded matchup was ${esc(d.closeGame.a)} vs. ${esc(d.closeGame.b)} in Week ${esc(d.closeGame.week)}, decided by just <b>${fmt(d.closeGame.margin)}</b> points.`);
 if(d.a.over&&d.a.over.delta>0)p.push(`<b>${esc(d.a.over.name)}</b> was the biggest standings overachiever, finishing ${d.a.over.delta} place${d.a.over.delta===1?'':'s'} better than its points-for rank.`);
 if(d.a.under&&d.a.under.delta>0)p.push(`<b>${esc(d.a.under.name)}</b> was the biggest standings underachiever, finishing ${d.a.under.delta} place${d.a.under.delta===1?'':'s'} below its points-for rank.`);
 if(d.bestPick)p.push(`Draft-value leader: <b>${esc(d.bestPick.player.name)}</b> by ${esc(d.bestPick.manager.name)} at pick #${esc(d.bestPick.pick.pick_no)}, finishing ${d.bestPick.valueDelta>=0?'+':''}${fmt(d.bestPick.valueDelta)} slots versus captured fantasy-point rank.`);
 if(d.tx.length){
   p.push(`League activity produced <b>${d.tx.length}</b> cached transactions: ${d.trades.length} trade${d.trades.length===1?'':'s'}, ${d.waivers.length} waiver claim${d.waivers.length===1?'':'s'}, and ${d.freeAgents.length} free-agent move${d.freeAgents.length===1?'':'s'}.`);
   if(d.biggestBid?.bid>0)p.push(`The largest recorded waiver bid was <b>${fmt(d.biggestBid.bid)}</b> FAAB in Week ${esc(d.biggestBid.week)}.`);
 }
 return p;
}

function teamDetail(rosterId){const s=season(),{ownerByRoster}=mapping(s),r=s.rosters.find(x=>x.roster_id===+rosterId),u=ownerByRoster.get(+rosterId);if(!r)return;const picks=s.draftPicks.flatMap(d=>d.picks||[]).filter(p=>p.roster_id===+rosterId&&validPlayerPick(p));const games=[];for(const w of s.matchupWeeks){for(const [,a] of groupedMatchups(w)){const mine=a.find(x=>x.roster_id===+rosterId),opp=a.find(x=>x.roster_id!==+rosterId);if(mine&&opp)games.push({w:w.week,mine,opp,on:managerName(ownerByRoster.get(opp.roster_id),s.rosters.find(r=>r.roster_id===opp.roster_id))})}}$('#content').innerHTML=`<div class="grid"><section class="card span12"><button class="btn" id="backTeams">← Back</button><h2>${esc(managerName(u,r))} — ${s.league.season}</h2>${identityHtml(s,r.roster_id)}<div class="kpis"><div class="kpi"><div class="l">Record</div><div class="v">${r.settings?.wins||0}-${r.settings?.losses||0}-${r.settings?.ties||0}</div></div><div class="kpi"><div class="l">Points For</div><div class="v">${fmt(pf(r.settings))}</div></div><div class="kpi"><div class="l">Points Against</div><div class="v">${fmt(pa(r.settings))}</div></div><div class="kpi"><div class="l">Draft Picks</div><div class="v">${picks.length}</div></div></div></section><section class="card span8"><div class="section-title"><h2>Draft Picks</h2><small>Season position mix and pick order</small></div>${(()=>{const pc=positionCounts(picks);return `<div class="draft-summary"><div class="kpi"><div class="l">Top Position</div><div class="v">${esc(pc[0]?.[0]||'—')}</div></div><div class="kpi"><div class="l">First Pick</div><div class="v">${picks.length?'#'+Math.min(...picks.map(p=>Number(p.pick_no)||999)): '—'}</div></div><div class="kpi"><div class="l">Positions</div><div class="v">${pc.length}</div></div></div><div class="identity-badges">${pc.map(([p,c])=>`<span class="pill">${esc(p)} ${c}</span>`).join('')}</div>`})()}<table class="stack-table"><thead><tr><th>Pick</th><th>Player</th><th>Pos</th></tr></thead><tbody>${picks.map(p=>{const pl=playerLabel(p);return`<tr><td data-label="Pick">${p.pick_no}</td><td data-label="Player">${esc(pl.name)}</td><td data-label="Position">${esc(pl.pos)}</td></tr>`}).join('')||'<tr><td colspan="3">No picks.</td></tr>'}</tbody></table></section><section class="card span4"><div class="section-title"><h2>Schedule</h2></div>${games.map(g=>`<div class="matchup"><div>W${g.w} vs ${esc(g.on)}</div><b class="${+g.mine.points>+g.opp.points?'good':+g.mine.points<+g.opp.points?'bad':''}">${fmt(g.mine.points)} – ${fmt(g.opp.points)}</b></div>`).join('')||'<div class="empty">No games.</div>'}</section></div>`;$('#backTeams').onclick=()=>{state.tab='teams';render()}}

 const heading=e.target.closest('.mobile-nav-group>h3');
 if(heading){toggleMobileGroup(heading.parentElement);return}
 const b=e.target.closest('[data-mobile-tab]');if(!b)return;
 state.tab=b.dataset.mobileTab;state.navHub=TAB_TO_HUB[state.tab]||state.navHub;render();focusContentHeading();
 mobileNav.classList.remove('open');mobileToggle?.setAttribute('aria-expanded','false')
};
$('#seasonStrip').onclick=e=>{const b=e.target.closest('[data-season]');if(!b)return;state.active=b.dataset.season;render()};
$('#content').addEventListener('change',e=>{if(e.target?.id==='managerSeasonSelect'){state.managerSeasonRoster=e.target.value;render();return}if(e.target?.id==='weeklyWeekSelect'){state.weeklyWeek=Number(e.target.value);render();return}if(e.target?.id==='advSearchType'){state.advSearchType=e.target.value;render();return}
if(e.target?.id==='advSearchManager'){state.advSearchManager=e.target.value;render();return}
if(e.target?.id==='advSearchSeason'){state.advSearchSeason=e.target.value;render();return}
if(e.target?.id==='advSearchTxn'){state.advSearchTxn=e.target.value;render();return}
if(e.target?.id==='advSearchRound'){state.advSearchRound=e.target.value;render();return}
if(e.target?.id==='advSearchPlayoff'){state.advSearchPlayoff=e.target.value;render();return}
if(e.target?.id==='timelineType'){state.timelineType=e.target.value;render();return}
if(e.target?.id==='timelineStart'){state.timelineStart=e.target.value;render();return}
if(e.target?.id==='timelineEnd'){state.timelineEnd=e.target.value;render();return}
if(e.target?.id==='playoffPathManager'){state.playoffPathManager=e.target.value;render();return}if(e.target?.id==='playerLegacySelect'){state.playerLegacySelected=e.target.value;render();return}if(e.target?.id==='ctespnSource'){state.ctespnSource=e.target.value||'summary';render();return}
if(e.target?.id==='ctespnPlayer'){state.ctespnPlayer=e.target.value||'';render();return}
if(e.target?.id==='ctespnGame'){state.ctespnGame=e.target.value||'';render();return}
if(e.target?.id==='ctespnRivalry'){state.ctespnRivalry=e.target.value||'';render();return}
if(e.target?.id==='ctespnRecord'){state.ctespnRecord=e.target.value||'';render();return}
if(e.target?.id==='ctespnSeason'){state.ctespnSeason=e.target.value||'all';render();return}if(e.target?.id==='ctespnManager'){state.ctespnManager=e.target.value||'';render();return}});
$('#content').onclick=e=>{if(e.target.closest('[data-empty-backup]')){state.tab='backup';render();return;}if(e.target.closest('#ctespnReset')){state.ctespnSeason='all';state.ctespnManager='';state.ctespnSource='summary';state.ctespnPlayer='';state.ctespnGame='';state.ctespnRivalry='';state.ctespnRecord='';render();return}const dash=e.target.closest('[data-dash-tab]');if(dash){state.tab=dash.dataset.dashTab;render();return}const t=e.target.closest('[data-roster]');if(t)teamDetail(t.dataset.roster);const all=e.target.closest('#eraAll');if(all){const ys=state.seasons.map(s=>Number(s.league.season));state.eraStart=Math.min(...ys);state.eraEnd=Math.max(...ys);render()}if(e.target.closest('#backupDownload'))downloadBackup();if(e.target.closest('#backupChoose'))$('#backupFile')?.click();const ce=e.target.closest('[data-ctespn-export]');if(ce){exportCTESPN(ce.dataset.ctespnExport);return}const cc=e.target.closest('[data-ctespn-copy]');if(cc){copyCTESPN(cc.dataset.ctespnCopy);return}const sr=e.target.closest('[data-search-tab]');if(sr){if(sr.dataset.searchSeason)state.active=sr.dataset.searchSeason;state.tab=sr.dataset.searchTab;render()}if(e.target.closest('#historySearchBtn')){state.searchQuery=$('#historySearch')?.value||'';render()}if(e.target.closest('#historySearchClear')){state.searchQuery='';render()}const plh=e.target.closest('[data-open-player-history]');if(plh){state.playerSelected=plh.dataset.openPlayerHistory;state.tab='players';render();return}const ph=e.target.closest('[data-player-history]');if(ph){state.playerSelected=ph.dataset.playerHistory;state.tab='players';render()}if(e.target.closest('#playerBack')){state.playerSelected='';render()}if(e.target.closest('#playerHistorySearchBtn')){state.playerQuery=$('#playerHistorySearch')?.value||'';state.playerSelected='';render()}if(e.target.closest('#playerHistoryClear')){state.playerQuery='';state.playerSelected='';render()}};
$('#content').onchange=e=>{if(e.target.id==='eraStart'){state.eraStart=Number(e.target.value);render()}if(e.target.id==='eraEnd'){state.eraEnd=Number(e.target.value);render()}if(e.target.id==='backupFile'){const f=e.target.files?.[0];importBackupFile(f)}if(e.target.id==='compareA'){state.compareA=e.target.value;render()}if(e.target.id==='compareB'){state.compareB=e.target.value;render()}if(e.target.id==='legacyManagerSelect'){state.legacyManager=e.target.value;render()}if(e.target.id==='tendencyManagerSelect'){state.tendencyManager=e.target.value;render()}if(e.target.id==='ridiculousManagerSelect'){state.ridiculousManager=e.target.value;render()}if(e.target.id==='seasonCompareA'){state.seasonCompareA=e.target.value;render()}if(e.target.id==='seasonCompareB'){state.seasonCompareB=e.target.value;render()}};
$('#content').onkeydown=e=>{if(e.target.id==='historySearch'&&e.key==='Enter'){e.preventDefault();state.searchQuery=e.target.value;render()}if(e.target.id==='playerHistorySearch'&&e.key==='Enter'){e.preventDefault();state.playerQuery=e.target.value;state.playerSelected='';render()}};

document.addEventListener('keydown',e=>{
 const h=e.target.closest?.('.mobile-nav-group>h3');
 if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleMobileGroup(h.parentElement);return}
 const actionable=e.target.closest?.('[role="button"][tabindex="0"]');
 if(actionable&&(e.key==='Enter'||e.key===' ')){
   e.preventDefault();actionable.click();return;
 }
 if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='SELECT'){
   const search=$('#historySearch')||$('#advSearchQuery')||$('#playerHistorySearch');
   if(search){e.preventDefault();search.focus();search.select?.()}
 }
});
document.querySelectorAll('.mobile-nav-group').forEach(setMobileGroupA11y);

loadCache().finally(()=>render());

// v1.35 continuously bind any game-reference elements rendered by existing views
const __uclGameObserver=new MutationObserver(()=>__uclAutoLinkGameText(document));
try{__uclGameObserver.observe(document.documentElement,{childList:true,subtree:true});}catch(e){}
setTimeout(()=>__uclAutoLinkGameText(document),0);

document.addEventListener('change',e=>{if(e.target&&e.target.id==='playerImpactManager'){window.__playerImpactManager=e.target.value;try{render();}catch(_){}}});
</script>
